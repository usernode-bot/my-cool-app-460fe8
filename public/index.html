  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
          if (val instanceof Error) return val.stack || (val.name + ': ' + val.message);
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);

  <title>Run Club</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%230a7aff'/><text x='50' y='68' font-size='52' text-anchor='middle'>%F0%9F%8F%83</text></svg>">

  <!-- Display mode (theme). This runs BEFORE the stylesheet and before any
       markup, because the `dark` class it writes onto <html> is what the
       compiled `dark:` utilities key off: resolving the mode after the first
       paint is exactly what makes a dark boot flash light first.
       It owns the whole preference (read, write, OS query, notify) and
       exposes it as window.RunClubTheme so the app script below only has to
       draw the icon and the menu. -->
  <script>
  (function () {
    'use strict';

    var KEY = 'runclub.theme';
    var MODES = { dark: 1, light: 1, system: 1 };
    var params = new URLSearchParams(window.location.search);

    // The token carries the signed-in username, so the choice can be
    // namespaced per person on a shared device. This reads the claim
    // without verifying it, which is fine for picking a storage key and
    // nothing else. An offline load arrives with no token at all, hence
    // the shared key as well.
    var keys = (function () {
      var token = params.get('token') || '';
      var who = '';
      try {
        var part = String(token).split('.')[1];
        if (part) {
          var b64 = part.replace(/-/g, '+').replace(/_/g, '/');
          while (b64.length % 4) b64 += '=';
          var claims = JSON.parse(atob(b64));
          if (claims && claims.username) who = String(claims.username);
        }
      } catch (err) { /* not a readable token: use the shared key */ }
      return who ? [KEY + ':' + who, KEY] : [KEY];
    })();

    // A cross-origin frame can be refused storage outright, so every access
    // is guarded: the worst case is a choice that does not survive a
    // reload, never a screen that fails to render.
    function read() {
      for (var i = 0; i < keys.length; i++) {
        try {
          var v = window.localStorage.getItem(keys[i]);
          if (MODES[v]) return v;
        } catch (err) { return ''; }
      }
      return '';
    }

    // Written to the shared key too: an offline boot has no token, so the
    // per-user key is unreachable there and would otherwise read as
    // "never chose anything".
    function write(value) {
      try {
        window.localStorage.setItem(KEY, value);
        if (keys.length > 1) window.localStorage.setItem(keys[0], value);
      } catch (err) { /* storage refused: this load still honours the choice */ }
    }

    // Precedence: an explicit ?theme= deep link, then the remembered
    // choice, then System. The link is pure view state with no database
    // write, so it is deliberately not staging-gated, and deliberately not
    // persisted either: a link shared for a screenshot must not quietly
    // re-set the reader's own choice.
    var linked = params.get('theme');
    var mode = MODES[linked] ? linked : (read() || 'system');

    var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    var listeners = [];

    function resolve() {
      if (mode === 'dark' || mode === 'light') return mode;
      return (mq && mq.matches) ? 'dark' : 'light';
    }

    function apply() {
      var theme = resolve();
      var root = document.documentElement;
      root.classList.toggle('dark', theme === 'dark');
      // Native controls (the datetime-local picker, scrollbars, form
      // widgets) follow this rather than any class.
      root.style.colorScheme = theme;
      root.setAttribute('data-theme-mode', mode);
      root.setAttribute('data-theme', theme);
      for (var i = 0; i < listeners.length; i++) {
        try { listeners[i](mode, theme); } catch (err) { /* one bad listener must not stop the rest */ }
      }
    }

    if (mq) {
      var onSystemChange = function () { if (mode === 'system') apply(); };
      // addListener is the deprecated spelling, still the only one on
      // older Safari.
      if (mq.addEventListener) mq.addEventListener('change', onSystemChange);
      else if (mq.addListener) mq.addListener(onSystemChange);
    }

    window.RunClubTheme = {
      MODES: ['dark', 'light', 'system'],
      mode: function () { return mode; },
      theme: function () { return resolve(); },
      set: function (next) {
        if (!MODES[next] || next === mode) return;
        mode = next;
        write(next);
        apply();
      },
      // Called on every change, including an OS switch while on System.
      subscribe: function (fn) { listeners.push(fn); },
    };

    apply();
  })();
  </script>

  <!-- Tailwind, PRECOMPILED for this app. The config lives in
       tailwind.config.js at the repo root; the Dockerfile's builder stage
       compiles it to public/tailwind.css on every image build, so the
       stylesheet is regenerated from THIS commit's markup every deploy and
       can never drift behind the code.
       Writing class names as whole literals is what keeps this working — a
       class assembled from fragments at runtime (e.g. "bg-" + tone + "-500")
       is invisible to the compiler. -->
  <link rel="stylesheet" href="/tailwind.css">

  <!-- usernode-native UI kit, loaded AFTER tailwind.css so its component
       styles win over Tailwind's preflight reset. Centrally hosted: never
       vendor these, so kit fixes reach this app on the next page load. -->
  <link rel="stylesheet" href="/usernode-native/v1/native.css">
  <script src="/usernode-native/v1/native.js"></script>

  <!-- The platform bridge. Required whether or not this app calls a bridge
       API: it is also how the app answers the shell. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>

  <style>
    /* Playful rounded type: Baloo 2 for headings, Quicksand for body.
       Self-hosted from public/fonts/ (fetched once from Google Fonts, the
       same bytes the CDN serves) instead of a runtime Google Fonts request
       — the staging checks' headless browser doesn't reliably reach it, and
       a failed font stylesheet request there was logging a console error
       and failing every check on every route. font-display: swap keeps
       text visible immediately while these load. */
    @font-face {
      font-family: 'Baloo 2';
      font-style: normal;
      font-weight: 600 800;
      font-display: swap;
      src: url(/fonts/baloo2-latin.woff2) format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'Baloo 2';
      font-style: normal;
      font-weight: 600 800;
      font-display: swap;
      src: url(/fonts/baloo2-latin-ext.woff2) format('woff2');
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    @font-face {
      font-family: 'Quicksand';
      font-style: normal;
      font-weight: 400 700;
      font-display: swap;
      src: url(/fonts/quicksand-latin.woff2) format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'Quicksand';
      font-style: normal;
      font-weight: 400 700;
      font-display: swap;
      src: url(/fonts/quicksand-latin-ext.woff2) format('woff2');
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    /* Re-theme the kit to Run Club's blue. Physics and geometry stay the
       kit's; only the color tokens are ours. */
    :root {
      --un-accent: #0a7aff;
      --un-accent-contrast: #ffffff;
      --un-group-bg: #ffffff;
      --un-sheet-bg: #ffffff;
      --un-hairline: #ececf0;
      --un-muted: #8e8e93;
      --un-radius-card: 16px;
    }
    /* Same tokens for the dark skin. The kit ships its own `.dark` values,
       but ours are set on :root and would otherwise win in both modes, so
       every token overridden above needs a dark counterpart here. Sheets,
       modals, action sheets, popovers and toasts all read these. */
    .dark {
      --un-group-bg: #1c1c20;
      --un-sheet-bg: #1c1c20;
      /* A popover has no backdrop behind it, so this one stays fully
         opaque or the page reads through the menu. */
      --un-popover-bg: #26262b;
      --un-navbar-bg: rgba(18, 18, 22, 0.8);
      --un-hairline: #2c2c31;
      --un-muted: #98989f;
      --un-switch-track-off: #39393d;
      --un-action-neutral: #3a3a42;
      --un-backdrop: rgba(0, 0, 0, 0.55);
    }
    /* Headings get the rounder, bolder display face everywhere they occur,
       including ones injected by JS template strings, so every screen's
       titles feel more "berkesan" without a font class in each template. */
    h1, h2, h3 {
      font-family: 'Baloo 2', ui-sans-serif, system-ui, sans-serif;
    }
    /* Native date/time controls inherit the row's typography instead of
       the browser default, so the When row reads like the other two. */
    input[type="date"], input[type="time"] {
      font: inherit;
      color: inherit;
      background: transparent;
      -webkit-appearance: none;
      appearance: none;
      min-width: 0;
    }
    input[type="date"]::-webkit-calendar-picker-indicator,
    input[type="time"]::-webkit-calendar-picker-indicator { opacity: 0.35; }
    input[type="date"]:invalid, input[type="time"]:invalid { color: #b6b6bd; }
    .dark input[type="date"]:invalid, .dark input[type="time"]:invalid { color: #6f6f78; }
    .dark input[type="date"]::-webkit-calendar-picker-indicator,
    .dark input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.55; }
  </style>
</head>

  <script>
  (function () {
    'use strict';

    var params = new URLSearchParams(window.location.search);
    var token = params.get('token') || '';
    var authHeaders = token ? { 'x-usernode-token': token } : {};

    var homeEl = document.getElementById('screen-home');
    var detailEl = document.getElementById('screen-detail');
    var listEl = document.getElementById('run-list');
    var headingEl = document.getElementById('list-heading');
    var detailBodyEl = document.getElementById('detail-body');

    // Preset run types. Keep in sync with PRESET_TYPES in server.js: the
    // server is authoritative for validation, this list drives the picker,
    // and a label is only valid if BOTH sides know it.
    var PRESET_TYPES = ['Easy', 'Tempo', 'Long Run', 'Intervals', 'Race'];

    /* ── Meeting-point pin: static map thumbnail ───────────────────── */

    // Keyless OpenStreetMap raster tiles, assembled client-side with slippy
    // map math. The tile server asks for a descriptive UA and no key, and a
    // pin is a tiny absolutely positioned SVG rather than a pixel inset.
    function tileX(lng, z) {
      return Math.floor((lng + 180) / 360 * Math.pow(2, z));
    }
    function tileY(lat, z) {
      var rad = lat * Math.PI / 180;
      return Math.floor((1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2 * Math.pow(2, z));
    }
    function tileN(lng, z) {
      return (lng + 180) / 360 * Math.pow(2, z);
    }
    function tileNy(lat, z) {
      var rad = lat * Math.PI / 180;
      return (1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2 * Math.pow(2, z);
    }

    // Width and height in px; the zoom choice trades detail for street-name
    // legibility at both render sizes.
    function staticMapUrl(lat, lng, w, h) {
      var z = w >= 400 ? 16 : 15;
      var anchorN = tileN(lng, z);
      var anchorY = tileNy(lat, z);
      var centerTileX = Math.floor(anchorN);
      var centerTileY = Math.floor(anchorY);
      var urls = [];
      var cols = Math.ceil(w / 256);
      var rows = Math.ceil(h / 256);
      for (var ty = 0; ty < rows; ty++) {
        for (var tx = 0; tx < cols; tx++) {
          urls.push('https://tile.openstreetmap.org/' + z + '/' + (centerTileX + tx) + '/' + (centerTileY + ty) + '.png');
        }
      }
      return { urls: urls, z: z, anchorN: anchorN, anchorY: anchorY, centerTileX: centerTileX, centerTileY: centerTileY };
    }

    // The thumbnail: a fixed box, every tile absolutely positioned inside
    // it, and the pin drawn on top. onerror removes a failed tile so a
    // partial load reads as a smaller live map, never a broken image icon.
    function staticMapHtml(lat, lng, w, h) {
      var geo = staticMapUrl(lat, lng, w, h);
      var cols = Math.ceil(w / 256);
      var tiles = geo.urls.map(function (u, i) {
        return '<img class="absolute' + (i === 0 ? ' staticmap-first' : '') + '" src="' + u +
          '" width="256" height="256" alt="" loading="lazy" ' +
          'style="left:' + ((i % cols) * 256 - Math.floor(w / 2)) + 'px;top:' + (Math.floor(i / cols) * 256 - Math.floor(h / 2)) + 'px" ' +
          'onerror="this.style.display=\'none\'">';
      }).join('');
      return '<div class="staticmap relative overflow-hidden rounded-2xl bg-[#e5e5ea] dark:bg-[#26262b]" style="width:' + w + 'px;height:' + h + 'px" ' +
        'data-map="1">' +
          tiles +
          '<svg class="absolute z-10 text-[#0a7aff] dark:text-[#5aa9ff] drop-shadow-[0_1px_2px_rgba(0,0,0,0.4)]" width="30" height="42" viewBox="0 0 24 34" fill="currentColor" style="left:' + (w / 2 - 15) + 'px;top:' + (h / 2 - 40) + 'px"><path d="M12 0C5.4 0 0 5.4 0 12c0 9 12 22 12 22s12-13 12-22C24 5.4 18.6 0 12 0zm0 17a5 5 0 110-10 5 5 0 010 10z"/></svg>' +

    // A language tag can be malformed: some devices report POSIX-style
    // values like "en-US@posix", and a stored platform preference is just a
    // string. Intl throws a RangeError on those, which would take every
    // date on the screen down with it, so keep only tags Intl accepts and
    // fall back to the runtime default (undefined) otherwise.
    function safeLocale(tag) {

    // "not set", not English, so it falls through. The bridge's answer
    // below overrides all of these when it reports a real preference.

    // only has to change one value. `hourCycle` rather than `hour12`: the
    // boolean maps to h24 in a few locales, which renders midnight as
    // "24:00" instead of "00:00".
    var TIME_FORMATS = {

    /* ── Remembering the choice ───────────────────────────── */

    var FORMAT_KEY = 'runclub.timeFormat';

    // reload, never a screen that fails to render.

    // per-user key has to shadow a shared-key value left by someone else
    // on the same device.

    // Today / Tomorrow / Yesterday where they apply, a short date otherwise.
    function dayInfo(d) {

    // under an hour reads in minutes, an hour or more splits into hours
    // and leftover minutes. Not a clock time, so fmtTime is not involved.
    // Planned distance in kilometres, formatted the way runners talk:
    // whole km for round numbers, one decimal otherwise ("21.1 km").
    // Not a clock time, so fmtTime is not involved.
    function fmtKm(km) {

    function badgeHtml(info) {

      }

        return '<span class="px-2 py-0.5 rounded-md bg-[#dbeafe] dark:bg-[#12243d] text-[#0a7aff] dark:text-[#5aa9ff] text-[16px] font-semibold">' + esc(info.label) + '</span>';

    /* ── Home list ─────────────────────────────────────────────────── */

    function cardHtml(run) {

      // kudos. Rendered disabled for anonymous readers so the control is
      // visible to the checks, which browse without a token.
      var kudos = '';

        '</div>' +

    }

    function renderList() {

    /* ── Run details ───────────────────────────────────────────────── */

    function detailHtml(run, attendees) {

        (rows

          : '<div class="bg-white dark:bg-[#1c1c20] rounded-2xl px-4 py-8 text-center text-[17px] text-[#8e8e93] dark:text-[#98989f]">Nobody has joined yet.</div>') +
      '</div>';

        '<svg class="mt-0.5 shrink-0 text-[#0a7aff] dark:text-[#5aa9ff]" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.6v.1"/></svg>' +
        (isPast

            ? 'You are organizing this run. Cancel it from the menu if plans change.'
            : 'Join to be counted as going. You can leave anytime.') + '</p>';

    }

    function renderDetail() {
      if (!state.detail) return;

    }

    function loadDetail(id) {

        return state.detail;
      });
    }

    // Whole-literal class strings, same reason as the tab states above.
    var TF_ON = 'px-2.5 py-1 rounded-[8px] text-[13px] font-semibold bg-white dark:bg-[#38383d] text-[#111114] dark:text-white shadow-[0_1px_2px_rgba(0,0,0,0.08)]';
    var TF_OFF = 'px-2.5 py-1 rounded-[8px] text-[13px] font-semibold bg-transparent text-[#8e8e93] dark:text-[#98989f] shadow-none';

    function renderTimeFormat() {
      ['auto', '12', '24'].forEach(function (value) {

        var on = state.timeFormat === value;

      });

      // rendering, without depending on the container's timezone.

      app.setAttribute('data-time-format', effectiveFormat());
      app.setAttribute('data-time-format-mode', state.timeFormat);
    }

    /* -- Display mode: one icon, three choices --------------------- */

    // window.RunClubTheme (the <head> script) owns the preference itself.
    // Everything here is presentation: which glyph the header shows and
    // which menu the tap opens.
    var THEME_META = {
      dark: { label: 'Dark', glyph: '<path d="M20.5 14.7A8.6 8.6 0 019.3 3.5a8.6 8.6 0 1011.2 11.2z"/>' },
      light: { label: 'Light', glyph: '<circle cx="12" cy="12" r="4.1"/><path d="M12 2.6v2.1M12 19.3v2.1M2.6 12h2.1M19.3 12h2.1M5.3 5.3l1.5 1.5M17.2 17.2l1.5 1.5M18.7 5.3l-1.5 1.5M6.8 17.2l-1.5 1.5"/>' },
      system: { label: 'System', glyph: '<rect x="3" y="4.3" width="18" height="12.4" rx="2.1"/><path d="M9 20.2h6"/>' },
    };

    function themeSvg(mode, size) {
      return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" ' +
        'fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" ' +
        'stroke-linejoin="round">' + THEME_META[mode].glyph + '</svg>';
    }

    // call builds a fresh one.
    function themeIconEl(mode) {
      var holder = document.createElement('span');
      holder.innerHTML = themeSvg(mode, 20);
      return holder.firstElementChild;
    }

    function renderTheme() {
      var mode = RunClubTheme.mode();
      var label = 'Display mode: ' + THEME_META[mode].label;
      var buttons = document.querySelectorAll('.theme-btn');
      for (var i = 0; i < buttons.length; i++) {
        buttons[i].innerHTML = themeSvg(mode, 22);
        // Lets an automated check assert which mode the header is actually
        // advertising, without depending on the runner's OS preference.
        buttons[i].setAttribute('data-theme-mode', mode);
        buttons[i].setAttribute('aria-label', label);
        buttons[i].setAttribute('title', label);
      }
    }

    function chooseTheme(mode) {
      RunClubTheme.set(mode);
      notify('Display mode: ' + THEME_META[mode].label + '.');
    }

    function openThemeMenu(anchorEl) {
      var current = RunClubTheme.mode();

      // popover on a desktop, from this one call site.
      if (!(window.unNative && unNative.menu)) {
        // No kit (standalone or local dev): cycle through the three modes
        // so the control still does something honest.
        var order = RunClubTheme.MODES;

        return;
      }

        return {

          // marked in its own label.

        anchorEl: anchorEl,
        title: 'Display mode',

        cancelLabel: 'Close',

      }).catch(function () { /* dismissed */ });

    // not whether the compiled stylesheet still carries the dark palette: a
    // class name assembled at runtime, or a content glob that stops matching
    // this file, would leave every screen light while those assertions stay
    // green. This reports that gap as an error in the dev console, which the
    // baseline "loads with no console errors" check fails on. Deliberately
    // one-sided: it only speaks up when it can positively tell the page is
    // painted the wrong way round.

        // not landed yet. Not a verdict.

    /* -- Time format menu (run details) ---------------------------- */

      var current = state.timeFormat;
      if (!(window.unNative && unNative.menu)) {
        setFormat(FORMAT_ORDER[(FORMAT_ORDER.indexOf(current) + 1) % FORMAT_ORDER.length]);
        return;

        anchorEl: anchorEl,
        title: 'Time format',

        cancelLabel: 'Close',

      if (!tag || tag === locale) return;
      locale = tag;
      render();

    // check pinned to en-GB stays en-GB. null from the bridge means "no
    // preference set", not English: keep the boot value then.

    /* ── Screen switching ──────────────────────────────────────────── */

    function showScreen(name, type) {
      if (state.screen === name) return;
      state.screen = name;
      var apply = function () {
        homeEl.classList.toggle('hidden', name !== 'home');

      if (window.unNative && unNative.transition) unNative.transition(apply, { type: type || 'none' });

    /* ── New Run: quick day and time picks ─────────────────────────── */

    // Common run start times, [hour, minute]. The default and the time
    // pills both come from this one list.
    var RUN_TIMES = [[6, 0], [6, 30], [7, 0], [8, 0], [12, 0], [17, 30], [18, 0], [18, 30]];

    // Whole-literal class strings: the Tailwind extractor never sees an
    // assembled one. ON matches the Tomorrow badge on the list.
    var PICK_BASE = 'shrink-0 rounded-full border px-3.5 py-2 text-[15px] ';
    var PICK_CLASS = {
      on: PICK_BASE + 'bg-[#dbeafe] dark:bg-[#12243d] text-[#0a7aff] dark:text-[#5aa9ff] border-transparent font-semibold',
      off: PICK_BASE + 'border-[#e4e4ea] dark:border-[#33333a] text-[#111114] dark:text-[#f2f2f7]',
      disabled: PICK_BASE + 'border-[#e4e4ea] dark:border-[#33333a] text-[#111114] dark:text-[#f2f2f7] opacity-40',
    };
    var PICK_ROW = 'flex gap-2 overflow-x-auto overscroll-x-contain -mx-1 px-1 pb-0.5';

    function pad2(n) { return String(n).padStart(2, '0'); }

    // datetime-local wants local wall-clock time, never an ISO/UTC string.
    function toLocalInputValue(d) {
      return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) +
        'T' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    }

    // Dates are built from local parts, never by adding milliseconds, so a
    // DST day still lands on the same wall-clock time.
    function atSlot(day, slot) {
      return new Date(day.getFullYear(), day.getMonth(), day.getDate(), slot[0], slot[1]);
    }

    function addDays(d, n) {
      return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
    }

    function sameDay(a, b) {
      return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() &&
        a.getDate() === b.getDate();
    }

    // First common start time today at least an hour away, else tomorrow 7:00.
    function defaultStart(now) {
      var cutoff = now.getTime() + 60 * 60 * 1000;
      for (var i = 0; i < RUN_TIMES.length; i++) {
        var d = atSlot(now, RUN_TIMES[i]);
        if (d.getTime() >= cutoff) return d;
      }
      return atSlot(addDays(now, 1), [7, 0]);
    }

    // Today, Tomorrow, then this weekend's days not already covered.
    function dayPicks(now) {
      var picks = [
        { key: 'today', label: 'Today', date: addDays(now, 0) },
        { key: 'tomorrow', label: 'Tomorrow', date: addDays(now, 1) },
      ];
      for (var n = 2; n <= 6; n++) {
        var d = addDays(now, n);
        var dow = d.getDay();
        if (dow !== 6 && dow !== 0) continue;
        var label;
        try { label = new Intl.DateTimeFormat(locale, { weekday: 'short' }).format(d); }
        catch (err) { label = dow === 6 ? 'Sat' : 'Sun'; }
        picks.push({ key: dow === 6 ? 'sat' : 'sun', label: label, date: d });
      }
      return picks;
    }

    function parseWhen(value) {
      if (!value) return null;
      var d = new Date(value);
      return isNaN(d.getTime()) ? null : d;
    }

    // A start moment still counts as upcoming for one minute, so a run
    // posted "now" at the top of a minute is not blocked. The server keeps
    // the final say.
    function isPastStart(d) {
      return d.getTime() < Date.now() - 60 * 1000;
    }

    // Builds the pills and the summary under the When row. #f-when stays
    // the single source of truth: every tap writes to it and fires `input`,
    // so the sheet's own listeners run exactly as if the user had typed.
    function attachWhenPicks(when) {
      var whenRow = when.parentNode;
      var now = new Date();
      var days = dayPicks(now);

      var wrap = document.createElement('div');
      wrap.id = 'when-picks';
      wrap.className = 'space-y-2.5 px-1';
      wrap.setAttribute('data-time-format', effectiveFormat());

      var dayRow = document.createElement('div');
      dayRow.id = 'when-days';
      dayRow.className = PICK_ROW;
      days.forEach(function (p) {
        var b = document.createElement('button');
        b.type = 'button';
        b.setAttribute('data-day', p.key);
        b.textContent = p.label;
        b.addEventListener('click', function () { pickDay(p.date); });
        dayRow.appendChild(b);
      });

      var timeRow = document.createElement('div');
      timeRow.id = 'when-times';
      timeRow.className = PICK_ROW;
      RUN_TIMES.forEach(function (slot) {
        var b = document.createElement('button');
        b.type = 'button';
        b.setAttribute('data-time', pad2(slot[0]) + ':' + pad2(slot[1]));
        b.textContent = fmtTime(atSlot(now, slot));
        b.addEventListener('click', function () { pickTime(slot); });
        timeRow.appendChild(b);
      });

      var summary = document.createElement('div');
      summary.id = 'when-summary';
      summary.className = 'pt-0.5';
      summary.setAttribute('aria-live', 'polite');

      wrap.appendChild(dayRow);
      wrap.appendChild(timeRow);
      wrap.appendChild(summary);
      whenRow.insertAdjacentElement('afterend', wrap);

      function commit(d) {
        when.value = toLocalInputValue(d);
        when.dispatchEvent(new Event('input', { bubbles: true }));
      }

      // Keeps the chosen time. Picking Today after that time has passed
      // moves to the first common start still ahead, if there is one.
      function pickDay(day) {
        var cur = parseWhen(when.value) || defaultStart(new Date());
        var next = atSlot(day, [cur.getHours(), cur.getMinutes()]);
        if (isPastStart(next)) {
          for (var i = 0; i < RUN_TIMES.length; i++) {
            var d = atSlot(day, RUN_TIMES[i]);
            if (!isPastStart(d)) { next = d; break; }
          }
        }
        commit(next);
      }

      function pickTime(slot) {
        var cur = parseWhen(when.value) || defaultStart(new Date());
        commit(atSlot(cur, slot));
      }

      function render() {
        var d = parseWhen(when.value);
        Array.prototype.forEach.call(dayRow.children, function (b, i) {
          var on = !!d && sameDay(d, days[i].date);
          b.className = on ? PICK_CLASS.on : PICK_CLASS.off;
          b.setAttribute('aria-pressed', on ? 'true' : 'false');
        });
        Array.prototype.forEach.call(timeRow.children, function (b, i) {
          var slot = RUN_TIMES[i];
          var on = !!d && d.getHours() === slot[0] && d.getMinutes() === slot[1];
          var gone = !!d && sameDay(d, new Date()) && isPastStart(atSlot(d, slot));
          b.disabled = gone;
          b.className = gone ? PICK_CLASS.disabled : (on ? PICK_CLASS.on : PICK_CLASS.off);
          b.setAttribute('aria-pressed', on ? 'true' : 'false');
        });

        if (!d) {
          summary.removeAttribute('data-past');
          summary.innerHTML = '<div class="text-[15px] text-[#8e8e93] dark:text-[#98989f]">Pick a date and time.</div>';
          return;
        }
        var past = isPastStart(d);
        var full;
        try {
          full = new Intl.DateTimeFormat(locale, { weekday: 'long', month: 'long', day: 'numeric' }).format(d);
        } catch (err) { full = d.toDateString(); }
        if (past) summary.setAttribute('data-past', '1');
        else summary.removeAttribute('data-past');
        summary.innerHTML =
          '<div class="text-[17px] font-semibold text-[#111114] dark:text-[#f2f2f7]">' +
            esc(dayInfo(d).label) + ' · <span class="run-time">' + esc(fmtTime(d)) + '</span>' +
          '</div>' +
          (past
            ? '<div class="text-[15px] text-[#ff3b30] dark:text-[#ff6961]">That time has passed. Pick a later one.</div>'
            : '<div class="text-[15px] text-[#8e8e93] dark:text-[#98989f]">' + esc(full) + '</div>');
      }

      when.addEventListener('input', render);
      when.addEventListener('change', render);
      render();
    }

                '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>' +

    function openSheet() {
      if (state.sheet) return;
      var contentEl = buildSheet();
      var handle = unNative.presentSheet({
        contentEl: contentEl,
        onDismiss: function () {
          state.sheet = null;
          if (location.hash === '#new') setHash('');
        },
      });
      state.sheet = handle;

      var where = contentEl.querySelector('#f-where');
      var when = contentEl.querySelector('#f-when');
      var duration = contentEl.querySelector('#f-duration');
      var distance = contentEl.querySelector('#f-distance');
      var note = contentEl.querySelector('#f-note');
      var meetingRow = contentEl.querySelector('#meeting-row');
      var meetingInput = contentEl.querySelector('#f-meeting');
      var meetingHint = contentEl.querySelector('#meeting-hint');
      var meetingStatus = contentEl.querySelector('#meeting-status');
      var meetingThumb = contentEl.querySelector('#meeting-thumb');
      var post = contentEl.querySelector('#post-run-btn');
      var typeRow = contentEl.querySelector('#type-row');
      var typeValueEl = contentEl.querySelector('#type-value');
      var typeValue = '';
      var meetingPin = null; // { lat, lng } once the geocoder has answered
      var meetingSeq = 0;
      var meetingTimer = null;

      // Every state change lands here: what the hint says, whether the
      // thumbnail shows, and what data-map advertises to the checks.
      function setMeetingPin(pin) {
        meetingPin = pin;
        meetingRow.setAttribute('data-map', pin ? '1' : '0');
        meetingThumb.innerHTML = '';
        meetingThumb.classList.toggle('hidden', !pin);
        if (pin) {
          meetingThumb.innerHTML = staticMapHtml(pin.lat, pin.lng, 264, 120);
        }
      }

      function setMeetingStatus(text) {
        meetingStatus.textContent = text || '';
        meetingStatus.classList.toggle('hidden', !text);
        if (text) meetingHint.classList.add('hidden');
      }

      function setMeetingHint(text) {
        meetingHint.textContent = text || '';
        meetingHint.classList.toggle('hidden', !text);
        if (text) meetingStatus.classList.add('hidden');
      }

      // Debounced: one lookup per pause in typing, never per keystroke.
      function scheduleMeetingLookup() {
        meetingSeq += 1;
        var seq = meetingSeq;
        setMeetingPin(null);
        setMeetingStatus('');
        var text = meetingInput.value.trim();
        if (!text) { setMeetingHint('Keep typing to search the map'); return; }
        setMeetingHint('');
        setMeetingStatus('Searching the map...');
        if (meetingTimer) clearTimeout(meetingTimer);
        meetingTimer = setTimeout(function () {
          if (seq !== meetingSeq) return;
          geocode(text).then(function (pin) {
            if (seq !== meetingSeq) return;
            if (pin) {
              setMeetingPin(pin);
              setMeetingStatus('');
            } else {
              setMeetingPin(null);
              setMeetingStatus('No map match. The meeting point will be saved without a map.');
            }
          }).catch(function () {
            if (seq !== meetingSeq) return;
            setMeetingPin(null);
            setMeetingStatus('The map could not be reached. The meeting point will be saved without a map.');
          });
        }, 600);
      }

      meetingInput.addEventListener('input', scheduleMeetingLookup);
      meetingInput.addEventListener('change', scheduleMeetingLookup);

      // The chosen label. Empty means "no type", which stays valid: the
      // server stores NULL and every existing screen renders unchanged.
      function setTypeValue(v) {
        typeValue = v || '';
        if (typeValue) {
          typeValueEl.textContent = typeValue;
          typeValueEl.className = 'min-w-0 flex-1 text-right text-[17px] text-[#0a7aff] dark:text-[#5aa9ff] font-medium';
        } else {
          typeValueEl.textContent = 'Optional';
          typeValueEl.className = 'min-w-0 flex-1 text-right text-[17px] text-[#b6b6bd] dark:text-[#6f6f78]';
        }
      }

      // One shared save path for Add and Rename: the alert's field carries
      // the value, the server owns validation, and the message it sends
      // back is what the toast shows. Keeps the picker honest about
      // preset-name collisions (case-insensitive) without duplicating rules.
      function saveType(url, method, currentValue, onSaved) {
        return unNative.alert({
          title: method === 'POST' ? 'Add type' : 'Rename type',
          field: { placeholder: 'e.g. Trail', value: currentValue || '' },
          buttons: [
            { label: 'Save', style: 'default' },
            { label: 'Cancel', style: 'cancel' },
          ],
        }).then(function (res) {
          var label = res && res.value ? String(res.value).trim() : '';
          if (!res || res.button.style === 'cancel' || !label) return;
          api(url, { method: method, body: JSON.stringify({ label: label }) })
            .then(function (data) {
              return loadRunTypes().then(function () {
                if (onSaved) onSaved(data.type);
              });
            })
            .catch(function (err) { notify(err.message); });
        }).catch(function () { /* dismissed */ });
      }

      function pickType(id) {
        var own = state.customTypes.filter(function (t) { return t.id === id; })[0];
        if (!own) return;
        unNative.menu({
          anchorEl: typeRow,
          title: own.label,
          items: [
            { label: 'Use', value: 'use' },
            { label: 'Rename', value: 'rename' },
            { label: 'Delete', destructive: true, value: 'delete' },
          ],
          cancelLabel: 'Cancel',
        }).then(function (choice) {
          if (!choice) return;
          if (choice.value === 'use') {
            setTypeValue(own.label);
            return;
          }
          if (choice.value === 'rename') {
            saveType('/api/run-types/' + own.id, 'PATCH', own.label, function (t) {
              if (typeValue === own.label && t) setTypeValue(t.label);
            });
            return;
          }
          unNative.alert({
            title: 'Delete this type?',
            message: 'Runs already posted with it keep the name.',
            buttons: [
              { label: 'Keep it', style: 'cancel' },
              { label: 'Delete', style: 'destructive' },
            ],
          }).then(function (res) {
            if (!res || !res.button || res.button.style !== 'destructive') return;
            api('/api/run-types/' + own.id, { method: 'DELETE' })
              .then(function () {
                if (typeValue === own.label) setTypeValue('');
                return loadRunTypes();
              })
              .catch(function (err) { notify(err.message); });
          }).catch(function () { /* dismissed */ });
        }).catch(function () { /* dismissed */ });
      }

      function openTypePicker() {
        if (!(window.unNative && unNative.menu)) return;
        var items = PRESET_TYPES.map(function (name) {
          return { label: name + (typeValue === name ? '  ✓' : ''), value: 'pick|' + name };
        });
        state.customTypes.forEach(function (t) {
          items.push({ label: t.label + (typeValue === t.label ? '  ✓' : ''), value: 'own|' + t.id });
        });
        items.push({ label: 'Add type', value: 'add' });
        unNative.menu({
          anchorEl: typeRow,
          title: 'Type',
          items: items,
          cancelLabel: 'Cancel',
        }).then(function (choice) {
          if (!choice) return;
          if (choice.value === 'add') {
            saveType('/api/run-types', 'POST', '', function (t) {
              if (t) setTypeValue(t.label);
            });
            return;
          }
          if (choice.value.slice(0, 4) === 'own|') {
            pickType(parseInt(choice.value.slice(4), 10));
            return;
          }
          setTypeValue(choice.value.slice(5));
        }).catch(function () { /* dismissed */ });
      }

      typeRow.addEventListener('click', openTypePicker);

      var photoRow = contentEl.querySelector('#photo-row');
      var photoAddBtn = contentEl.querySelector('#photo-add-btn');
      var photoInput = contentEl.querySelector('#f-photo-input');
      var photoPreviewWrap = contentEl.querySelector('#photo-preview-wrap');
      var photoPreviewImg = contentEl.querySelector('#photo-preview');
      var photoRemoveBtn = contentEl.querySelector('#photo-remove-btn');
      var photo = null; // { url, id } once an upload has succeeded

      // usernode.uploadFile rejects with no platform shell (standalone/dev);
      // hide the control there instead of offering something that always fails.
      if (!(window.usernode && usernode.uploadFile)) {
        photoRow.classList.add('hidden');
      } else {
        photoAddBtn.addEventListener('click', function () { photoInput.click(); });

        photoInput.addEventListener('change', function () {
          var file = photoInput.files && photoInput.files[0];
          photoInput.value = '';
          if (!file) return;
          var label = photoAddBtn.querySelector('span');
          photoAddBtn.disabled = true;
          label.textContent = 'Uploading...';
          downscaleImage(file)
            .then(function (blob) { return usernode.uploadFile(blob, { visibility: 'public' }); })
            .then(function (stored) {
              photo = { url: stored.url, id: stored.id };
              photoPreviewImg.src = stored.url;
              photoPreviewWrap.classList.remove('hidden');
              photoAddBtn.classList.add('hidden');
            })
            .catch(function (err) { notify(photoErrorMessage(err)); })
            .then(function () {
              photoAddBtn.disabled = false;
              label.textContent = 'Add photo';
            });
        });

        photoRemoveBtn.addEventListener('click', function () {
          photo = null;
          photoPreviewWrap.classList.add('hidden');
          photoAddBtn.classList.remove('hidden');
        });
      }

      // Default to the first common start time at least an hour away, so a
      // poster usually only has to confirm or make one tap.
      when.value = toLocalInputValue(defaultStart(new Date()));
      attachWhenPicks(when);

      function sync() {
        var start = parseWhen(when.value);
        post.disabled = !(where.value.trim() && start && !isPastStart(start));
      }
      [where, when].forEach(function (el) {
        el.addEventListener('input', sync);
        el.addEventListener('change', sync);
      });
      sync();

      contentEl.querySelector('#sheet-close').addEventListener('click', function () {
        handle.dismiss();
      });

      post.addEventListener('click', function () {
        if (post.disabled) return;
        var startsAt = new Date(when.value);
        if (isNaN(startsAt.getTime())) { notify('Pick a date and time.'); return; }
        // Optional planned duration in whole minutes. Blank means "not
        // set"; anything else goes to the server as-is and the server
        // owns validation, so the toast carries its message.
        var durationMinutes = null;
        if (duration.value.trim() !== '') {
          durationMinutes = duration.value.trim();
        }
        // Optional planned distance in kilometres. Blank means "not set";
        // anything else goes to the server as-is and the server owns
        // validation, so the toast carries its message.
        var distanceKm = null;
        if (distance.value.trim() !== '') {
          distanceKm = distance.value.trim();
        }
        post.disabled = true;
        post.textContent = 'Posting...';
        api('/api/runs', {
          method: 'POST',
          body: JSON.stringify({
            location: where.value.trim(),
            note: note.value.trim(),
            starts_at: startsAt.toISOString(),
            type: typeValue,
            meeting_point: meetingInput.value.trim() || undefined,
            meeting_lat: meetingPin ? meetingPin.lat : undefined,
            meeting_lng: meetingPin ? meetingPin.lng : undefined,
            duration_minutes: durationMinutes === null ? undefined : durationMinutes,
            distance_km: distanceKm === null ? undefined : distanceKm,
            photo_url: photo ? photo.url : undefined,
            photo_file_id: photo ? photo.id : undefined,
          }),
        }).then(function () {
          handle.dismiss();
          state.tab = 'upcoming';
          renderTabs();
          return loadRuns();
        }).then(function () {
          notify('Run posted.');
        }).catch(function (err) {
          post.disabled = false;
          post.textContent = 'Post run';
          notify(err.message);
        });
      });

      where.focus({ preventScroll: true });
    }

    /* ── Actions ───────────────────────────────────────────────────── */

    // The shared message is the detail screen's own summary plus a tokenless
    // deep link: origin + pathname drops the ?token= query, and the server's
    // catch-all already lands a tokenless visitor on #run/<id> via the
    // platform's chromeless view. Worded with the words the screen already
    // uses ("runners going" / "went", badge + fmtTime).
    function shareTextFor(run) {
      var when = new Date(run.starts_at);
      var info = dayInfo(when);
      var isPast = when.getTime() < Date.now();
      var count = run.attendee_count || 0;
      var where = (run.note ? run.note + ' \u00b7 ' : '') + run.location;
      var shareUrl = location.origin + location.pathname + '#run/' + run.id;
      var lines = [
        where,
        info.label + ' \u00b7 ' + fmtTime(when),
        count + (count === 1 ? ' runner ' : ' runners ') + (isPast ? 'went' : 'going') + ' so far.',
      ];
      var duration = fmtDuration(run.duration_minutes);
      if (duration) lines[1] = lines[1] + ' \u00b7 ' + duration;
      var dist = fmtKm(run.distance_km);
      if (dist) lines[1] = lines[1] + ' \u00b7 ' + dist;
      lines.push(isPast ? shareUrl : 'Join: ' + shareUrl);
      return lines.join('\n');
    }

    function joinRun(id) {
      return api('/api/runs/' + id + '/join', { method: 'POST' });
    }

    function leaveRun(id) {
      return api('/api/runs/' + id + '/leave', { method: 'POST' });
    }

    function refreshBoth(id) {
      var jobs = [loadRuns()];
      if (id != null && state.detail && state.detail.run.id === id) {
        jobs.push(loadDetail(id).then(renderDetail));
      }
      return Promise.all(jobs);
    }

    listEl.addEventListener('click', function (e) {
      var kudosBtn = e.target.closest('.kudos-btn');
      if (kudosBtn) {
        // Same rule as the join buttons: stop the tap so it does not also
        // navigate into the run detail.
        e.stopPropagation();
        if (kudosBtn.disabled) return;
        kudosBtn.disabled = true;
        var kid = parseInt(kudosBtn.dataset.id, 10);
        api('/api/runs/' + kid + '/kudos', { method: 'POST' })
          .then(function (data) {
            var run = state.runs.find(function (r) { return r.id === kid; });
            if (run) {
              run.kudos_count = data.count;
              run.kudos_from_me = data.kudos_from_me;
            }
            renderList();
          })
          .catch(function (err) { kudosBtn.disabled = false; notify(err.message); });
        return;
      }
      var join = e.target.closest('.join-btn');
      if (join) {
        // The card underneath is itself a button; stop the tap here so a
        // join does not also navigate.
        e.stopPropagation();
        if (join.dataset.joined === '1') return;
        join.disabled = true;
        joinRun(parseInt(join.dataset.id, 10))
          .then(function () { return loadRuns(); })
          .catch(function (err) { join.disabled = false; notify(err.message); });
        return;
      }
      var card = e.target.closest('.run-card');
      if (card) setHash('run/' + card.dataset.id);
    });

    listEl.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      var card = e.target.closest('.run-card');
      if (card) { e.preventDefault(); setHash('run/' + card.dataset.id); }
    });

    detailBodyEl.addEventListener('click', function (e) {
      var kudosBtn = e.target.closest('#kudos-btn');
      if (kudosBtn && state.detail) {
        kudosBtn.disabled = true;
        var kudosId = state.detail.run.id;
        api('/api/runs/' + kudosId + '/kudos', { method: 'POST' })
          .then(function (data) {
            state.detail.run.kudos_count = data.count;
            state.detail.run.kudos_from_me = data.kudos_from_me;
            renderDetail();
          })
          .catch(function (err) { kudosBtn.disabled = false; notify(err.message); });
        return;
      }
      var btn = e.target.closest('#detail-action');
      if (!btn || !state.detail) return;
      var id = state.detail.run.id;
      var leaving = btn.dataset.action === 'leave';
      btn.disabled = true;
      (leaving ? leaveRun(id) : joinRun(id))
        .then(function () { return refreshBoth(id); })
        .then(function () { notify(leaving ? 'You left this run.' : 'You are going.'); })
        .catch(function (err) { btn.disabled = false; notify(err.message); });
    });

    document.getElementById('more-btn').addEventListener('click', function (e) {
      if (!state.detail) return;
      var run = state.detail.run;
      var isPast = new Date(run.starts_at).getTime() < Date.now();
    var items = [];
      // Share first: it is relevant to every viewer, while the entries
      // below it only exist in some states.
      items.push({ label: 'Share', value: 'share' });
      // Reminder toggle: only for attendees of a run that has not
      // started, so the menu stays exactly as short as it is today for
      // everyone else. The label is the action the tap performs.
      if (!isPast && run.joined) {
        items.push({
          label: run.reminders_off ? 'Reminders on' : 'Reminders off',
          value: 'reminders',
        });
      }
      if (!isPast && run.is_organizer) {
        items.push({ label: 'Cancel run', destructive: true, value: 'cancel', icon: 'trash' });
      } else if (!isPast && run.joined) {
        items.push({ label: 'Leave run', destructive: true, value: 'leave' });
      }
      // The detail screen shows a time but has no room for the segmented
      // control, so the same choice lives here, one level down.
      items.push({ label: 'Time format', value: 'timeformat' });
      unNative.menu({ anchorEl: e.currentTarget, items: items, cancelLabel: 'Cancel' })
        .then(function (choice) {
          if (!choice) return;
          if (choice.value === 'timeformat') {
            openTimeFormatMenu(e.currentTarget);
            return;
          }
          if (choice.value === 'reminders') {
            var wantOn = run.reminders_off;
            return api('/api/runs/' + run.id + '/reminders', {
              method: 'PUT',
              body: JSON.stringify({ enabled: wantOn }),
            }).then(function (data) {
              if (state.detail && state.detail.run.id === run.id) {
                state.detail.run.reminders_off = data.reminders_off;
              }
              notify(wantOn ? 'Reminders on.' : 'Reminders off.');
            });
          }
          if (choice.value === 'share') {
            var message = shareTextFor(run);
            if (navigator.share) {
              navigator.share({ text: message }).catch(function () { /* dismissed */ });
            } else if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(message)
                .then(function () { notify('Run link copied.'); })
                .catch(function () { notify('Could not share this run.'); });
            } else {
              notify('Sharing is not available here.');
            }
            return;
          }
          if (choice.value === 'leave') {
            return leaveRun(run.id)
              .then(function () { return refreshBoth(run.id); })
              .then(function () { notify('You left this run.'); });
          }
          return unNative.alert({
            title: 'Cancel this run?',
            message: 'Everyone who joined will lose it. This cannot be undone.',
            buttons: [
              { label: 'Keep it', style: 'cancel' },
              { label: 'Cancel run', style: 'destructive' },
            ],
          }).then(function (res) {
            if (!res || !res.button || res.button.style !== 'destructive') return;
            // Best-effort: an orphaned upload just sits against the app's
            // quota, which is a smaller problem than a cancel that fails
            // because the storage call did.
            var cleanup = (run.photo_file_id && window.usernode && usernode.deleteFile)
              ? usernode.deleteFile(run.photo_file_id).catch(function () {})
              : Promise.resolve();
            return cleanup
              .then(function () { return api('/api/runs/' + run.id, { method: 'DELETE' }); })
              .then(function () {
                state.detail = null;
                setHash('');
                return loadRuns();
              }).then(function () { notify('Run cancelled.'); });
          });
        })
        .catch(function (err) { notify(err.message); });
    });

    document.getElementById('new-run-btn').addEventListener('click', function () {
      setHash('new');
    });

    document.getElementById('back-btn').addEventListener('click', function () {
      setHash('');
    });

    [['tab-upcoming', 'upcoming'], ['tab-past', 'past']].forEach(function (pair) {
      document.getElementById(pair[0]).addEventListener('click', function () {
        if (state.tab === pair[1]) return;
        state.tab = pair[1];
        state.runs = [];
        renderTabs();
        renderList();
        loadRuns();
      });
    });

    // Distance chips are multi-select: each tap adds or removes one chip,
    // and no chip active shows every run. Toggling never refetches, it
    // only narrows what is already on the board.
    ['5k', '10k', 'half'].forEach(function (id) {
      document.getElementById('dist-' + id).addEventListener('click', function () {
        var at = state.dist.indexOf(id);
        if (at === -1) state.dist.push(id);
        else state.dist.splice(at, 1);
        renderDistFilter();
        renderList();
      });
    });

    /* ── Routing: #new and #run/<id> are the deep links ────────────── */

    var suppressHash = false;

    function setHash(value) {
      var next = value ? '#' + value : '';
      if ((location.hash || '') === next) { route(); return; }
      if (next) location.hash = next;
      else if (history.replaceState) {
        history.replaceState(null, '', location.pathname + location.search);
        route();
      } else location.hash = '';
    }

    function route() {
      if (suppressHash) return;
      var h = (location.hash || '').replace(/^#/, '');
      var run = h.match(/^run\/(\d+)$/);

      if (run) {
        if (state.sheet) state.sheet.dismiss();
        var id = parseInt(run[1], 10);
        var already = state.detail && state.detail.run.id === id;
        loadDetail(id).then(function () {
          renderDetail();
          showScreen('detail', already ? 'none' : 'push');
        }).catch(function (err) {
          notify(err.message);
          setHash('');
        });
        return;
      }

      showScreen('home', 'pop');
      // A Past-tab deep link for reviewers: the state link opens the board
      // directly on the finished runs, where Kudos renders.
      if (h === 'tab-past') {
        if (state.tab !== 'past') {
          state.tab = 'past';
          state.runs = [];
          renderTabs();
        }
        renderList();
        loadRuns();
      }
      if (h === 'new') {
        openSheet();
      } else if (state.sheet) {
        state.sheet.dismiss();
      }
    }

    window.addEventListener('hashchange', route);

    /* ── Boot ──────────────────────────────────────────────────────── */

    // Precedence: an explicit ?tf= deep link (12, 24 or auto), then the
    // remembered choice, then Auto so the locale decides for anyone who
    // never touches the switch. The link is pure view state with no database write, so it is
    // deliberately not staging-gated: the "before" screenshot is taken
    // against production. It is also deliberately NOT persisted, so a link
    // shared for a screenshot cannot quietly re-set the reader's own
    // choice, and so the default stays the default on the next plain load.
    (function resolveFormat() {
      var linked = params.get('tf');
      if (FORMAT_MODES[linked]) {
        state.timeFormat = linked;
        return;
      }
      var stored = readFormat();
      if (stored) state.timeFormat = stored;
    })();

    // A distance deep link for reviewers: the query param pre-activates
    // chips for a single load. Same view-state rules as ?tf= above: no
    // database write, never persisted, so a shared link cannot quietly
    // re-set the reader's own choice.
    (function resolveDist() {
      var linked = (params.get('dist') || '').toLowerCase();
      if (!linked) return;
      state.dist = linked.split(',').filter(function (id) { return !!DIST_FILTERS[id]; });
    })();

    renderTheme();
    renderTimeFormat();
    renderTabs();
    renderDistFilter();
    loadRunTypes();
    loadRuns().then(route);

    if (window.unNative && unNative.attachPullToRefresh) {
      unNative.attachPullToRefresh(window, function () {
        return state.screen === 'detail' && state.detail
          ? loadDetail(state.detail.run.id).then(renderDetail)
          : loadRuns();
      }, { content: document.getElementById('app') });
    }

    /* ── Run reminders ─────────────────────────────────────────────── */

    // One reminder per run, claimed server-side: the poll reads what is
    // due, toasts it, then marks exactly those run ids sent. A second
    // tab (or device) polling the same reminder finds sent_at already
    // set, so the toast can never fire twice.
    var reminderTimer = null;

    function pollReminders() {
      api('/api/reminders/due')
        .then(function (data) {
          var due = data.reminders || [];
          due.forEach(function (r) {
            notify('Your run starts in 1 hour.');
          });
          if (due.length) {
            return api('/api/reminders/due/claim', {
              method: 'POST',
              body: JSON.stringify({
                run_ids: due.map(function (r) { return r.run_id; }),
              }),
            });
          }
        })
        .catch(function (err) {
          // A signed-out or stale-token view (the checker's browser, an
          // expired session) cannot poll reminders; the 401 is expected
          // there, so idle quietly rather than log a console error.
        });
    }

    function startReminders() {
      // A signed-out view (the checker's browser, an expired session)
      // has no token to poll with, so don't even ask: the endpoint is
      // auth-gated and a 401 would be a console error on every load.
      if (reminderTimer || !token) return;
      pollReminders();
      reminderTimer = setInterval(pollReminders, 60 * 1000);
    }

    function stopReminders() {
      if (reminderTimer) { clearInterval(reminderTimer); reminderTimer = null; }
    }

    // The shell keeps hidden apps loaded but invisible: stop the poll
    // while nobody is looking, catch up immediately on show.
    window.addEventListener('usernode:visibility-changed', function (e) {
      if (e && e.detail && e.detail.hidden) stopReminders();
      else startReminders();
    });

    startReminders();
  })();
  </script>
</body>
</html>
