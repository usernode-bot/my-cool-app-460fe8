<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  
  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
          if (val instanceof Error) return val.stack || (val.name + ': ' + val.message);
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>Run Club</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%230a7aff'/><text x='50' y='68' font-size='52' text-anchor='middle'>%F0%9F%8F%83</text></svg>">

  <!-- Tailwind, PRECOMPILED for this app. The config lives in
       tailwind.config.js at the repo root; the Dockerfile's builder stage
       compiles it to public/tailwind.css on every image build, so the
       stylesheet is regenerated from THIS commit's markup every deploy and
       can never drift behind the code.
       Writing class names as whole literals is what keeps this working — a
       class assembled from fragments at runtime (e.g. "bg-" + tone + "-500")
       is invisible to the compiler. -->
  <link rel="stylesheet" href="/tailwind.css">

  <!-- usernode-native UI kit, loaded AFTER tailwind.css so its component
       styles win over Tailwind's preflight reset. Centrally hosted: never
       vendor these, so kit fixes reach this app on the next page load. -->
  <link rel="stylesheet" href="https://social-vibecoding.usernodelabs.org/usernode-native/v1/native.css">
  <script src="https://social-vibecoding.usernodelabs.org/usernode-native/v1/native.js"></script>

  <!-- The platform bridge. Required whether or not this app calls a bridge
       API: it is also how the app answers the shell. -->
  <script src="https://social-vibecoding.usernodelabs.org/usernode-bridge/v1/bridge.js"></script>

  <style>
    /* Re-theme the kit to Run Club's blue. Physics and geometry stay the
       kit's; only the color tokens are ours. */
    :root {
      --un-accent: #0a7aff;
      --un-accent-contrast: #ffffff;
      --un-group-bg: #ffffff;
      --un-sheet-bg: #ffffff;
      --un-hairline: #ececf0;
      --un-muted: #8e8e93;
      --un-radius-card: 16px;
    }
    /* Native date/time controls inherit the row's typography instead of
       the browser default, so the When row reads like the other two. */
    input[type="date"], input[type="time"] {
      font: inherit;
      color: inherit;
      background: transparent;
      -webkit-appearance: none;
      appearance: none;
      min-width: 0;
    }
    input[type="date"]::-webkit-calendar-picker-indicator,
    input[type="time"]::-webkit-calendar-picker-indicator { opacity: 0.35; }
    input[type="date"]:invalid, input[type="time"]:invalid { color: #b6b6bd; }
  </style>
</head>
<body class="bg-[#f2f2f7] text-[#111114] antialiased">
  <!-- Safe-area top inset: bare env() is 0px inside the platform frame, so
       the bridge-forwarded custom property comes first with env() as the
       standalone fallback. -->
  <div id="app" class="mx-auto w-full max-w-[560px]"
       style="padding-top: calc(var(--un-safe-inset-top, env(safe-area-inset-top, 0px)) + 14px);
              padding-bottom: calc(var(--un-safe-inset-bottom, env(safe-area-inset-bottom, 0px)));">

    <!-- ── Home ─────────────────────────────────────────────────────── -->
    <section id="screen-home" class="px-5 pb-24">
      <header class="flex items-start justify-between gap-4">
        <h1 class="text-[40px] font-extrabold tracking-tight leading-none pt-1">Run Club</h1>
        <button id="new-run-btn" type="button" aria-label="Post a new run"
          class="un-touch-target shrink-0 w-[52px] h-[52px] rounded-full bg-white shadow-[0_1px_3px_rgba(0,0,0,0.08)] flex items-center justify-center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </button>
      </header>

      <!-- Filled in by renderGoal(); empty until the first response lands,
           so the tabs never jump down after a flash of placeholder. -->
      <section id="weekly-goal" class="mt-6"></section>

      <div class="mt-6 grid grid-cols-2 gap-1 p-1 bg-[#e5e5ea] rounded-[14px]">
        <button id="tab-upcoming" type="button" data-tab="upcoming"
          class="rounded-[11px] py-2.5 text-[17px] font-medium bg-white text-[#111114] shadow-[0_1px_3px_rgba(0,0,0,0.08)]">Upcoming</button>
        <button id="tab-past" type="button" data-tab="past"
          class="rounded-[11px] py-2.5 text-[17px] font-medium bg-transparent text-[#8e8e93] shadow-none">Past</button>
      </div>

      <div class="mt-6 mb-3 px-1 flex items-center justify-between gap-3">
        <h2 id="list-heading" class="text-[13px] font-semibold tracking-[0.07em] text-[#8e8e93]">UPCOMING RUNS</h2>
        <div id="time-format" role="group" aria-label="Time format"
          class="shrink-0 flex items-center gap-0.5 p-0.5 bg-[#e5e5ea] rounded-[10px]">
          <button id="tf-12" type="button" data-format="12" aria-pressed="true"
            class="px-2.5 py-1 rounded-[8px] text-[13px] font-semibold bg-white text-[#111114] shadow-[0_1px_2px_rgba(0,0,0,0.08)]">AM/PM</button>
          <button id="tf-24" type="button" data-format="24" aria-pressed="false"
            class="px-2.5 py-1 rounded-[8px] text-[13px] font-semibold bg-transparent text-[#8e8e93] shadow-none">24h</button>
        </div>
      </div>
      <div id="run-list" class="space-y-3"></div>
    </section>

    <!-- ── Run details ──────────────────────────────────────────────── -->
    <section id="screen-detail" class="px-5 pb-24 hidden">
      <header class="flex items-center justify-between">
        <button id="back-btn" type="button" aria-label="Back"
          class="un-touch-target w-[52px] h-[52px] rounded-full bg-white shadow-[0_1px_3px_rgba(0,0,0,0.08)] flex items-center justify-center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 5l-7 7 7 7"/>
          </svg>
        </button>
        <button id="more-btn" type="button" aria-label="More options"
          class="un-touch-target w-[52px] h-[52px] rounded-full bg-white shadow-[0_1px_3px_rgba(0,0,0,0.08)] flex items-center justify-center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/>
          </svg>
        </button>
      </header>
      <h1 class="mt-4 text-[40px] font-extrabold tracking-tight leading-none">Run details</h1>
      <div id="detail-body" class="mt-6 space-y-6"></div>
    </section>

  </div>

  <script>
  (function () {
    'use strict';

    var params = new URLSearchParams(window.location.search);
    var token = params.get('token') || '';
    var authHeaders = token ? { 'x-usernode-token': token } : {};

    var homeEl = document.getElementById('screen-home');
    var detailEl = document.getElementById('screen-detail');
    var listEl = document.getElementById('run-list');
    var headingEl = document.getElementById('list-heading');
    var detailBodyEl = document.getElementById('detail-body');

    var state = {
      tab: 'upcoming',
      runs: [],
      detail: null,      // { run, attendees }
      screen: 'home',
      sheet: null,
      sheetKind: null,   // 'new' | 'goal'; only one sheet is up at a time
      goal: null,        // the whole /api/me/goal payload, or null
      goalLoaded: false, // distinguishes "no goal" from "not asked yet"
      me: null,          // resolved from the first API response we own
      timeFormat: '12',  // '12' (am/pm) or '24'; resolved at boot below
    };

    /* ── Small helpers ─────────────────────────────────────────────── */

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function hash(s) {
      var h = 0;
      for (var i = 0; i < String(s).length; i++) h = (h * 31 + String(s).charCodeAt(i)) >>> 0;
      return h;
    }

    function api(url, opts) {
      var o = opts || {};
      var headers = Object.assign({}, authHeaders, o.headers || {});
      if (o.body) headers['Content-Type'] = 'application/json';
      return fetch(url, Object.assign({}, o, { headers: headers })).then(function (res) {
        return res.json().catch(function () { return {}; }).then(function (data) {
          if (!res.ok) throw new Error(data.error || 'Something went wrong.');
          return data;
        });
      });
    }

    function notify(message) {
      if (window.unNative && unNative.toast) unNative.toast(message);
    }

    /* ── Run photo upload ─────────────────────────────────────────── */

    // The platform does no server-side resizing and rejects anything over
    // 5MB, and an un-downscaled phone photo routinely exceeds that, so a
    // picked photo is always re-encoded client-side before it's uploaded.
    function downscaleImage(file) {
      return new Promise(function (resolve) {
        var objectUrl = URL.createObjectURL(file);
        var img = new Image();
        img.onload = function () {
          URL.revokeObjectURL(objectUrl);
          var maxEdge = 1600;
          var scale = Math.min(1, maxEdge / Math.max(img.width, img.height));
          var w = Math.max(1, Math.round(img.width * scale));
          var h = Math.max(1, Math.round(img.height * scale));
          var canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          canvas.toBlob(function (blob) {
            resolve(blob || file);
          }, 'image/jpeg', 0.85);
        };
        img.onerror = function () {
          URL.revokeObjectURL(objectUrl);
          // Not every browser can decode every format into an <img> the
          // same way; fall back to uploading the original rather than
          // blocking the post over a resize failure.
          resolve(file);
        };
        img.src = objectUrl;
      });
    }

    var PHOTO_ERROR_MESSAGES = {
      file_too_large: 'That photo is too large. Max size is 5MB.',
      invalid_image: 'That does not look like a photo.',
      app_quota_exceeded: 'Photo storage is full right now.',
      user_quota_exceeded: 'You have used up your photo storage.',
      staging_quota_exceeded: 'Photo storage is full in this preview.',
      storage_unavailable: 'Photos are not available right now.',
    };

    function photoErrorMessage(err) {
      var code = err && (err.code || err.error);
      return PHOTO_ERROR_MESSAGES[code] || 'That photo could not be uploaded.';
    }

    /* ── Locale-aware dates ────────────────────────────────────────── */

    // A language tag can be malformed: some devices report POSIX-style
    // values like "en-US@posix", and a stored platform preference is just a
    // string. Intl throws a RangeError on those, which would take every
    // date on the screen down with it, so keep only tags Intl accepts and
    // fall back to the runtime default (undefined) otherwise.
    function safeLocale(tag) {
      if (!tag) return undefined;
      try {
        new Intl.DateTimeFormat(tag);
        return tag;
      } catch (err) {
        return undefined;
      }
    }

    var locale = safeLocale(navigator.language);
    if (window.usernode && usernode.getUserLocale) {
      usernode.getUserLocale().then(function (r) {
        // null means "no preference set", not English: keep the device
        // language in that case.
        var next = r && r.locale ? safeLocale(r.locale) : undefined;
        if (next) { locale = next; render(); }
      }).catch(function () {});
    }

    /* ── Time of day: one helper, two formats ──────────────────── */

    // Every clock time on every screen goes through fmtTime, so the toggle
    // only has to flip one value. `hourCycle` rather than `hour12`: the
    // boolean maps to h24 in a few locales, which renders midnight as
    // "24:00" instead of "00:00".
    var TIME_FORMATS = {
      '12': { hour: 'numeric', minute: '2-digit', hourCycle: 'h12' },
      '24': { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' },
    };

    function fmtTime(d) {
      var opts = TIME_FORMATS[state.timeFormat] || TIME_FORMATS['12'];
      try {
        return new Intl.DateTimeFormat(locale, opts).format(d);
      } catch (err) {
        // hourCycle is the newer of the two option names. On an Intl that
        // rejects it, fall back to the boolean rather than dropping the
        // time off the card entirely.
        return new Intl.DateTimeFormat(locale, {
          hour: opts.hour, minute: opts.minute, hour12: state.timeFormat !== '24',
        }).format(d);
      }
    }

    /* ── Distances ─────────────────────────────────────────────── */

    // Distances are stored to one decimal, so "5" reads as 5 km and "6.5"
    // keeps its half. Locale-aware because a decimal comma is the norm in
    // most of the places this app is opened from.
    function fmtKm(n) {
      var v = Math.round((Number(n) || 0) * 10) / 10;
      try {
        return new Intl.NumberFormat(locale, { maximumFractionDigits: 1 }).format(v);
      } catch (err) {
        return String(v);
      }
    }

    /* ── Remembering the choice ───────────────────────────── */

    var FORMAT_KEY = 'runclub.timeFormat';

    // The token carries the signed-in username, so the preference can be
    // namespaced per person on a shared device. This reads the claim
    // without verifying it, which is fine for picking a storage key and
    // nothing else. An offline load arrives with no token at all, hence
    // the shared key below as well.
    function tokenUsername() {
      if (!token) return '';
      try {
        var part = String(token).split('.')[1];
        if (!part) return '';
        var b64 = part.replace(/-/g, '+').replace(/_/g, '/');
        while (b64.length % 4) b64 += '=';
        var claims = JSON.parse(atob(b64));
        return claims && claims.username ? String(claims.username) : '';
      } catch (err) {
        return '';
      }
    }

    var formatKeys = (function () {
      var who = tokenUsername();
      return who ? [FORMAT_KEY + ':' + who, FORMAT_KEY] : [FORMAT_KEY];
    })();

    // A cross-origin frame can be refused storage outright, so every access
    // is guarded: the worst case is a choice that does not survive a
    // reload, never a screen that fails to render.
    function readFormat() {
      for (var i = 0; i < formatKeys.length; i++) {
        try {
          var v = window.localStorage.getItem(formatKeys[i]);
          if (v === '12' || v === '24') return v;
        } catch (err) {
          return '';
        }
      }
      return '';
    }

    // Written to the shared key too: an offline boot has no token, so the
    // per-user key is unreachable there and would otherwise read as
    // "never chose anything".
    function writeFormat(value) {
      try {
        window.localStorage.setItem(FORMAT_KEY, value);
        if (formatKeys.length > 1) window.localStorage.setItem(formatKeys[0], value);
      } catch (err) { /* storage refused: this load still honours the choice */ }
    }

    function setFormat(value) {
      if (value !== '12' && value !== '24') return;
      if (state.timeFormat === value) return;
      state.timeFormat = value;
      writeFormat(value);
      render();
    }

    // Today / Tomorrow / Yesterday where they apply, a short date otherwise.
    function dayInfo(d) {
      var today = new Date(); today.setHours(0, 0, 0, 0);
      var that = new Date(d); that.setHours(0, 0, 0, 0);
      var days = Math.round((that.getTime() - today.getTime()) / 86400000);
      if (days === 0) return { label: 'Today', tone: 'today' };
      if (days === 1) return { label: 'Tomorrow', tone: 'tomorrow' };
      if (days === -1) return { label: 'Yesterday', tone: 'plain' };
      return {
        label: new Intl.DateTimeFormat(locale, {
          weekday: 'short', month: 'short', day: 'numeric',
        }).format(d),
        tone: 'plain',
      };
    }

    function badgeHtml(info) {
      if (info.tone === 'today') {
        return '<span class="px-2 py-0.5 rounded-md bg-[#d7f5de] text-[#1b8a3d] text-[16px] font-semibold">' + esc(info.label) + '</span>';
      }
      if (info.tone === 'tomorrow') {
        return '<span class="px-2 py-0.5 rounded-md bg-[#dbeafe] text-[#0a7aff] text-[16px] font-semibold">' + esc(info.label) + '</span>';
      }
      return '<span class="text-[16px] font-semibold text-[#111114]">' + esc(info.label) + '</span>';
    }

    /* ── Location glyphs and avatars ───────────────────────────────── */

    // Whole-literal class strings: Tailwind's extractor is a regex over
    // this file, so an assembled "bg-[" + hex + "]" would never compile.
    var GLYPHS = [
      { bg: 'bg-[#dcf5e3]', fg: 'text-[#23a455]', d: 'M12 3l4 6h-2.5l3 5H14l3 5H7l3-5H7.5l3-5H8l4-6zM12 19v2' },
      { bg: 'bg-[#dbeafe]', fg: 'text-[#2b7fff]', d: 'M3 8c2-2 4-2 6 0s4 2 6 0 4-2 6 0M3 13c2-2 4-2 6 0s4 2 6 0 4-2 6 0M3 18c2-2 4-2 6 0s4 2 6 0 4-2 6 0' },
      { bg: 'bg-[#ede4ff]', fg: 'text-[#8b5cf6]', d: 'M12 21s7-5.5 7-11a7 7 0 10-14 0c0 5.5 7 11 7 11zM12 12a2.5 2.5 0 100-5 2.5 2.5 0 000 5z' },
      { bg: 'bg-[#ffe8d5]', fg: 'text-[#f97316]', d: 'M12 5c5 0 9 3.1 9 7s-4 7-9 7-9-3.1-9-7 4-7 9-7zm0 4c2.2 0 4 1.3 4 3s-1.8 3-4 3-4-1.3-4-3 1.8-3 4-3z' },
      { bg: 'bg-[#ffe1ee]', fg: 'text-[#ec4899]', d: 'M3 19l6-10 4 6 2.5-4L21 19H3z' },
    ];

    function glyphHtml(location, size) {
      var g = GLYPHS[hash(location) % GLYPHS.length];
      var box = size === 'lg' ? 'w-[52px] h-[52px]' : 'w-[52px] h-[52px]';
      return '<div class="' + box + ' shrink-0 rounded-[14px] ' + g.bg + ' ' + g.fg +
        ' flex items-center justify-center">' +
        '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
        'stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="' + g.d + '"/></svg></div>';
    }

    // A run's own photo (if the organizer added one) stands in for the
    // generated glyph everywhere the glyph would otherwise show.
    function mediaHtml(run, size) {
      if (run.photo_url) {
        var box = size === 'lg' ? 'w-[52px] h-[52px]' : 'w-[52px] h-[52px]';
        return '<img src="' + esc(run.photo_url) + '" alt="" class="' + box +
          ' shrink-0 rounded-[14px] object-cover">';
      }
      return glyphHtml(run.location, size);
    }

    // The platform exposes usernames, not profile photos, so an initial on
    // a stable color stands in for one.
    var AVATAR_TONES = [
      'bg-[#f97316]', 'bg-[#0a7aff]', 'bg-[#22c55e]',
      'bg-[#a855f7]', 'bg-[#ec4899]', 'bg-[#14b8a6]',
    ];

    function avatarHtml(username, size, ring) {
      var tone = AVATAR_TONES[hash(username) % AVATAR_TONES.length];
      var dims = size === 'lg'
        ? 'w-11 h-11 text-[18px]'
        : (size === 'md' ? 'w-9 h-9 text-[15px]' : 'w-8 h-8 text-[13px]');
      var initial = String(username || '?').trim().charAt(0).toUpperCase() || '?';
      return '<span title="' + esc(username) + '" class="' + dims + ' ' + tone +
        ' shrink-0 rounded-full text-white font-semibold flex items-center justify-center' +
        (ring ? ' ring-2 ring-white' : '') + '">' + esc(initial) + '</span>';
    }

    function clusterHtml(names) {
      if (!names || !names.length) return '';
      return '<div class="flex items-center -space-x-2">' +
        names.map(function (n) { return avatarHtml(n, 'sm', true); }).join('') + '</div>';
    }

    /* ── Home list ─────────────────────────────────────────────────── */

    function cardHtml(run) {
      var past = state.tab === 'past';
      var when = new Date(run.starts_at);
      var info = dayInfo(when);
      var count = run.attendee_count || 0;
      var note = run.note
        ? '<p class="mt-1 text-[17px] text-[#8e8e93] truncate">' + esc(run.note) + '</p>'
        : '';

      // Runs posted before distances existed, and anyone who skipped the
      // field, simply have no distance line. No "unknown" placeholder.
      var distance = run.distance_km == null
        ? ''
        : '<span class="run-distance shrink-0 px-2 py-0.5 rounded-md bg-[#f1f1f5] text-[15px] font-semibold text-[#6b6b73]">' +
            esc(fmtKm(run.distance_km)) + ' km</span>';

      var action = '';
      if (!past) {
        action = run.joined
          ? '<button type="button" class="join-btn shrink-0 px-5 py-2.5 rounded-full bg-[#e9e9ef] text-[#8e8e93] text-[17px] font-semibold" data-id="' + run.id + '" data-joined="1">Joined</button>'
          : '<button type="button" class="join-btn shrink-0 px-6 py-2.5 rounded-full bg-[#0a7aff] text-white text-[17px] font-semibold" data-id="' + run.id + '" data-joined="0">Join</button>';
      }

      return '<div class="run-card un-pressable bg-white rounded-2xl p-4 shadow-[0_1px_3px_rgba(0,0,0,0.05)]" role="button" tabindex="0" data-id="' + run.id + '">' +
        '<div class="flex gap-3">' + mediaHtml(run) +
          '<div class="min-w-0 flex-1">' +
            '<h3 class="text-[19px] font-bold leading-tight truncate">' + esc(run.location) + '</h3>' +
            '<div class="mt-1.5 flex items-center gap-2">' + badgeHtml(info) +
              '<span class="run-time text-[17px] text-[#8e8e93]">' + esc(fmtTime(when)) + '</span>' +
              distance +
            '</div>' +
            note +
          '</div>' +
        '</div>' +
        '<div class="mt-3.5 flex items-center justify-between gap-3">' +
          '<div class="flex items-center min-w-0">' + clusterHtml(run.preview) +
            '<span class="ml-2 text-[17px] text-[#8e8e93] truncate">' + count + ' ' + (past ? 'went' : 'going') + '</span>' +
          '</div>' + action +
        '</div>' +
      '</div>';
    }

    function renderList() {
      headingEl.textContent = state.tab === 'past' ? 'PAST RUNS' : 'UPCOMING RUNS';
      if (!state.runs.length) {
        listEl.innerHTML = '<p class="py-12 text-center text-[17px] text-[#8e8e93]">' +
          (state.tab === 'past'
            ? 'No past runs yet.'
            : 'No upcoming runs. Tap + to post one.') + '</p>';
        return;
      }
      listEl.innerHTML = state.runs.map(cardHtml).join('');
    }

    var TAB_ON = 'rounded-[11px] py-2.5 text-[17px] font-medium bg-white text-[#111114] shadow-[0_1px_3px_rgba(0,0,0,0.08)]';
    var TAB_OFF = 'rounded-[11px] py-2.5 text-[17px] font-medium bg-transparent text-[#8e8e93] shadow-none';

    function renderTabs() {
      document.getElementById('tab-upcoming').className =
        state.tab === 'upcoming' ? TAB_ON : TAB_OFF;
      document.getElementById('tab-past').className =
        state.tab === 'past' ? TAB_ON : TAB_OFF;
    }

    function loadRuns() {
      return api('/api/runs?filter=' + state.tab).then(function (data) {
        state.runs = data.runs || [];
        renderList();
      }).catch(function (err) {
        notify(err.message);
      });
    }

    /* ── Run details ───────────────────────────────────────────────── */

    function detailHtml(run, attendees) {
      var when = new Date(run.starts_at);
      var info = dayInfo(when);
      var whenText = info.label + ' · ' + fmtTime(when);
      var isPast = when.getTime() < Date.now();
      var count = run.attendee_count || 0;

      var action = '';
      if (!isPast && !run.is_organizer) {
        action = run.joined
          ? '<button id="detail-action" type="button" data-action="leave" class="shrink-0 px-6 py-2.5 rounded-full bg-[#e9e9ef] text-[#6b6b73] text-[17px] font-semibold">Leave</button>'
          : '<button id="detail-action" type="button" data-action="join" class="shrink-0 px-7 py-2.5 rounded-full bg-[#0a7aff] text-white text-[17px] font-semibold">Join</button>';
      }

      var note = run.note
        ? '<p class="mt-1 text-[17px] text-[#8e8e93]">' + esc(run.note) + '</p>'
        : '';

      // Only rendered when the run has a photo; contributes nothing to the
      // layout otherwise (no placeholder box for photo-less runs).
      var banner = run.photo_url
        ? '<img id="detail-photo" src="' + esc(run.photo_url) + '" alt="" class="w-full aspect-[16/9] rounded-2xl object-cover">'
        : '';

      var summary =
        '<div class="bg-white rounded-2xl p-4">' +
          '<div class="flex gap-3">' + mediaHtml(run, 'lg') +
            '<div class="min-w-0 flex-1">' +
              '<h2 class="text-[19px] font-bold leading-tight">' + esc(run.location) + '</h2>' +
              '<p class="mt-1 text-[17px] font-semibold text-[#0a7aff]">' + esc(info.label) + ' · ' +
                '<span class="run-time">' + esc(fmtTime(when)) + '</span></p>' +
              note +
            '</div>' +
          '</div>' +
          '<div class="mt-4 pt-4 border-t border-[#ececf0] flex items-center justify-between gap-3">' +
            '<div class="flex items-center gap-3 min-w-0">' + avatarHtml(run.organizer_username, 'lg') +
              '<span class="min-w-0 text-[17px] leading-snug text-[#8e8e93] break-words">Organized by ' + esc(run.organizer_username) + '</span>' +
            '</div>' + action +
          '</div>' +
        '</div>';

      // `wrap` lets a long value run onto a second line instead of being cut
      // off; the short ones stay on a single right-aligned line.
      function infoRow(iconPath, label, value, blue, wrap, id) {
        return '<div' + (id ? ' id="' + id + '"' : '') + ' class="flex items-center gap-3 px-4 py-4">' +
          '<svg class="shrink-0 text-[#0a7aff]" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="' + iconPath + '"/></svg>' +
          '<span class="shrink-0 text-[19px] font-medium">' + esc(label) + '</span>' +
          '<span class="ml-auto min-w-0 text-[19px] text-right ' + (wrap ? '' : 'truncate ') + (blue ? 'text-[#0a7aff] font-medium' : 'text-[#8e8e93]') + '">' + esc(value) + '</span>' +
        '</div>';
      }

      var PIN = 'M12 21s7-5.5 7-11a7 7 0 10-14 0c0 5.5 7 11 7 11zM12 12a2.5 2.5 0 100-5 2.5 2.5 0 000 5z';
      var CAL = 'M4 6.5A1.5 1.5 0 015.5 5h13A1.5 1.5 0 0120 6.5v12a1.5 1.5 0 01-1.5 1.5h-13A1.5 1.5 0 014 18.5v-12zM4 10h16M8 3v4M16 3v4';
      var PEOPLE = 'M9 11a3.5 3.5 0 100-7 3.5 3.5 0 000 7zM3 20a6 6 0 0112 0M17.5 11.5a3 3 0 100-6M18 20a5.5 5.5 0 00-2-4.3';
      var RULER = 'M3 8.5A1.5 1.5 0 014.5 7h15A1.5 1.5 0 0121 8.5v7a1.5 1.5 0 01-1.5 1.5h-15A1.5 1.5 0 013 15.5v-7zM7.5 7v3M12 7v4M16.5 7v3';

      var facts = '<div class="bg-white rounded-2xl divide-y divide-[#ececf0]">' +
        infoRow(PIN, 'Where', run.location, false, true) +
        infoRow(CAL, 'When', whenText, true) +
        (run.distance_km == null
          ? ''
          : infoRow(RULER, 'Distance', fmtKm(run.distance_km) + ' km', false, false, 'detail-distance')) +
        infoRow(PEOPLE, 'Going', count + (count === 1 ? ' runner' : ' runners'), false) +
      '</div>';

      var rows = (attendees || []).map(function (a) {
        var badge = a.is_organizer
          ? '<span class="px-2 py-0.5 rounded-md bg-[#dbeafe] text-[#0a7aff] text-[14px] font-semibold">Organizer</span>'
          : '';
        return '<div class="flex items-center gap-3 px-4 py-3.5">' +
          avatarHtml(a.username, 'lg') +
          '<span class="min-w-0 flex-1 text-[19px] font-medium truncate">' + esc(a.username) + '</span>' +
          badge +
        '</div>';
      }).join('');

      var going = '<div>' +
        '<h3 class="mb-2 px-1 text-[13px] font-semibold tracking-[0.07em] text-[#8e8e93]">WHO\'S GOING</h3>' +
        (rows
          ? '<div class="bg-white rounded-2xl divide-y divide-[#ececf0]">' + rows + '</div>'
          : '<div class="bg-white rounded-2xl px-4 py-8 text-center text-[17px] text-[#8e8e93]">Nobody has joined yet.</div>') +
      '</div>';

      var footnote = '<p class="flex items-start gap-2 px-1 pb-2 text-[15px] leading-snug text-[#8e8e93]">' +
        '<svg class="mt-0.5 shrink-0 text-[#0a7aff]" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.6v.1"/></svg>' +
        (isPast
          ? 'This run has already happened.'
          : run.is_organizer
            ? 'You are organizing this run. Cancel it from the menu if plans change.'
            : 'Join to be counted as going. You can leave anytime.') + '</p>';

      return banner + summary + facts + going + footnote;
    }

    function renderDetail() {
      if (!state.detail) return;
      detailBodyEl.innerHTML = detailHtml(state.detail.run, state.detail.attendees);
    }

    function loadDetail(id) {
      return api('/api/runs/' + id).then(function (data) {
        state.detail = { run: data.run, attendees: data.attendees || [] };
        return state.detail;
      });
    }

    /* ── Weekly goal card ──────────────────────────────────────────── */

    var goalEl = document.getElementById('weekly-goal');

    // Whole-literal class strings again: a bar tinted with an assembled
    // "bg-[" + hex + "]" would never make it into the compiled stylesheet.
    // The widths are the one thing Tailwind cannot express, so they are
    // inline styles rather than utilities.
    var GOAL_TONES = {
      blue: { done: 'bg-[#0a7aff]', planned: 'bg-[#bcd9ff]', value: 'text-[#0a7aff]' },
      green: { done: 'bg-[#23a455]', planned: 'bg-[#a9e3bf]', value: 'text-[#23a455]' },
    };

    var GOAL_CARD = 'bg-white rounded-2xl p-4 shadow-[0_1px_3px_rgba(0,0,0,0.05)]';
    var GOAL_CAP = 'text-[13px] font-semibold tracking-[0.07em] text-[#8e8e93]';

    function daysLeft(week) {
      if (!week || !week.ends_at) return 0;
      var ms = new Date(week.ends_at).getTime() - Date.now();
      if (isNaN(ms)) return 0;
      // The week always has at least today left in it, even on the last
      // evening, so never round down to zero.
      return Math.max(1, Math.ceil(ms / 86400000));
    }

    function goalHtml() {
      // Nothing at all until the first answer lands. An empty state that
      // flashes and is then replaced reads as a bug.
      if (!state.goalLoaded) return '';

      var payload = state.goal;

      if (!payload || !payload.goal) {
        // Signed out is its own sentence but the same empty card: there is
        // no goal to show either way, and offering a button that cannot
        // save would be worse than explaining why.
        var hint = token
          ? 'No goal yet. Pick a weekly distance and watch it fill up here.'
          : 'Open Run Club in Usernode to set a weekly goal.';
        var btn = token
          ? '<button id="set-goal-btn" type="button" class="un-pressable mt-3 w-full h-[46px] rounded-xl bg-[#0a7aff] text-white text-[17px] font-semibold">Set a weekly goal</button>'
          : '';
        return '<div id="weekly-goal-empty" class="' + GOAL_CARD + '">' +
          '<h2 class="' + GOAL_CAP + '">WEEKLY GOAL</h2>' +
          '<p class="mt-2 text-[17px] leading-snug text-[#8e8e93]">' + hint + '</p>' +
          btn +
        '</div>';
      }

      var target = payload.goal.target_km || 0;
      var p = payload.progress || {};
      var done = p.done_km || 0;
      var planned = p.planned_km || 0;
      var runs = p.run_count || 0;
      var undistanced = p.undistanced_count || 0;
      var met = target > 0 && done >= target;
      var tone = met ? GOAL_TONES.green : GOAL_TONES.blue;

      // The two segments share one track: what is already run, then what is
      // on the board for later this week. Neither can push the other off.
      var donePct = target > 0 ? Math.min(100, (done / target) * 100) : 0;
      var plannedPct = target > 0
        ? Math.max(0, Math.min(100 - donePct, (planned / target) * 100))
        : 0;

      var status = met
        ? 'Goal met. Nice one.'
        : (done === 0
            ? 'Nothing run yet this week.'
            : fmtKm(target - done) + ' km to go.');

      var days = daysLeft(payload.week);
      var lines = [
        runs + (runs === 1 ? ' run' : ' runs') + ' this week. ' +
          days + (days === 1 ? ' day' : ' days') + ' left.',
      ];
      if (planned > 0) lines.push(fmtKm(planned) + ' km more planned.');
      if (undistanced > 0) {
        lines.push(undistanced + (undistanced === 1 ? ' run has' : ' runs have') +
          ' no distance set, so it is not counted.');
      }

      return '<div class="' + GOAL_CARD + '">' +
        '<div class="flex items-center justify-between gap-3">' +
          '<h2 class="' + GOAL_CAP + '">WEEKLY GOAL</h2>' +
          '<button id="edit-goal-btn" type="button" class="un-touch-target shrink-0 text-[15px] font-semibold text-[#0a7aff]">Edit</button>' +
        '</div>' +
        '<p class="mt-1.5 text-[26px] font-extrabold tracking-tight">' +
          '<span class="' + tone.value + '">' + esc(fmtKm(done)) + '</span>' +
          '<span class="text-[#8e8e93] font-bold"> of ' + esc(fmtKm(target)) + ' km</span>' +
        '</p>' +
        '<div id="weekly-goal-bar" class="mt-3 h-[10px] w-full rounded-full bg-[#ececf0] overflow-hidden flex" ' +
             'role="img" aria-label="' + esc(fmtKm(done) + ' of ' + fmtKm(target) + ' kilometres run this week') + '">' +
          '<span class="block h-full ' + tone.done + '" style="width:' + donePct.toFixed(1) + '%"></span>' +
          '<span class="block h-full ' + tone.planned + '" style="width:' + plannedPct.toFixed(1) + '%"></span>' +
        '</div>' +
        '<p class="mt-2.5 text-[17px] font-semibold ' + tone.value + '">' + esc(status) + '</p>' +
        lines.map(function (line) {
          return '<p class="mt-0.5 text-[15px] leading-snug text-[#8e8e93]">' + esc(line) + '</p>';
        }).join('') +
      '</div>';
    }

    function renderGoal() {
      goalEl.innerHTML = goalHtml();
    }

    function loadGoal() {
      // ?demo=1 fills the card in a staging preview without seeding a row
      // that the "has this person set a goal?" read above would then be
      // answering from. Outside staging the route hands back null and the
      // real path below runs, so a demo link is never a different app.
      var injected = params.get('demo') === '1'
        ? api('/api/demo/goal').then(function (d) { return d && d.demo; }).catch(function () { return null; })
        : Promise.resolve(null);

      return injected.then(function (demo) {
        if (demo) return demo;
        if (!token) return null;
        // The token carries a locale but no timezone, and the week has to
        // roll over at the runner's own Monday, so the browser's zone is
        // the only place that answer can come from.
        var tz = '';
        try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (err) {}
        return api('/api/me/goal' + (tz ? '?tz=' + encodeURIComponent(tz) : ''));
      }).then(function (payload) {
        state.goal = payload || null;
      }).catch(function () {
        state.goal = null;
      }).then(function () {
        state.goalLoaded = true;
        renderGoal();
      });
    }

    // Whole-literal class strings, same reason as the tab states above.
    var TF_ON = 'px-2.5 py-1 rounded-[8px] text-[13px] font-semibold bg-white text-[#111114] shadow-[0_1px_2px_rgba(0,0,0,0.08)]';
    var TF_OFF = 'px-2.5 py-1 rounded-[8px] text-[13px] font-semibold bg-transparent text-[#8e8e93] shadow-none';

    function renderTimeFormat() {
      ['12', '24'].forEach(function (value) {
        var btn = document.getElementById('tf-' + value);
        var on = state.timeFormat === value;
        btn.className = on ? TF_ON : TF_OFF;
        btn.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
      // Lets an automated check assert which format the screen is actually
      // rendering, without depending on the container's timezone.
      document.getElementById('app').setAttribute('data-time-format', state.timeFormat);
    }

    function render() {
      renderTimeFormat();
      renderTabs();
      renderGoal();
      renderList();
      renderDetail();
    }

    /* ── Screen switching ──────────────────────────────────────────── */

    function showScreen(name, type) {
      if (state.screen === name) return;
      state.screen = name;
      var apply = function () {
        homeEl.classList.toggle('hidden', name !== 'home');
        detailEl.classList.toggle('hidden', name !== 'detail');
        window.scrollTo(0, 0);
      };
      if (window.unNative && unNative.transition) unNative.transition(apply, { type: type || 'none' });
      else apply();
    }

    /* ── New Run sheet ─────────────────────────────────────────────── */

    function buildSheet() {
      var wrap = document.createElement('div');
      wrap.className = 'pb-1';
      var ROW = 'flex items-center gap-3 rounded-2xl border border-[#e4e4ea] px-4 py-4';
      var LABEL = 'shrink-0 w-[64px] text-[17px] text-[#6b6b73]';
      var FIELD = 'flex-1 min-w-0 bg-transparent outline-none text-[17px] text-[#111114] placeholder:text-[#b6b6bd]';

      wrap.innerHTML =
        '<div class="flex items-center justify-between gap-3">' +
          '<h2 class="text-[30px] font-extrabold tracking-tight">New Run</h2>' +
          '<button id="sheet-close" type="button" aria-label="Close" class="un-touch-target shrink-0 w-9 h-9 rounded-full bg-[#e9e9ef] text-[#8e8e93] flex items-center justify-center">' +
            '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
          '</button>' +
        '</div>' +
        '<div class="mt-5 space-y-3">' +
          '<label class="' + ROW + '">' +
            '<svg class="shrink-0 text-[#23a455]" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.5 7-11a7 7 0 10-14 0c0 5.5 7 11 7 11zM12 12a2.5 2.5 0 100-5 2.5 2.5 0 000 5z"/></svg>' +
            '<span class="' + LABEL + '">Where</span>' +
            '<input id="f-where" type="text" maxlength="120" autocomplete="off" placeholder="e.g. Riverside Park" class="' + FIELD + '">' +
          '</label>' +
          '<div class="' + ROW + '">' +
            '<svg class="shrink-0 text-[#0a7aff]" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5A1.5 1.5 0 015.5 5h13A1.5 1.5 0 0120 6.5v12a1.5 1.5 0 01-1.5 1.5h-13A1.5 1.5 0 014 18.5v-12zM4 10h16M8 3v4M16 3v4"/></svg>' +
            '<span class="' + LABEL + '">When</span>' +
            '<input id="f-when" type="datetime-local" required aria-label="Date and time" class="' + FIELD + ' text-right">' +
          '</div>' +
          '<label class="' + ROW + '">' +
            '<svg class="shrink-0 text-[#f97316]" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5A1.5 1.5 0 014.5 7h15A1.5 1.5 0 0121 8.5v7a1.5 1.5 0 01-1.5 1.5h-15A1.5 1.5 0 013 15.5v-7zM7.5 7v3M12 7v4M16.5 7v3"/></svg>' +
            '<span class="' + LABEL + '">Distance</span>' +
            '<input id="f-distance" type="number" inputmode="decimal" step="0.1" min="0.1" max="200" placeholder="Optional" class="' + FIELD + ' text-right">' +
            '<span class="shrink-0 text-[17px] text-[#8e8e93]">km</span>' +
          '</label>' +
          '<label class="' + ROW + '">' +
            '<svg class="shrink-0 text-[#8b5cf6]" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8l-5-5zM14 3v5h5"/></svg>' +
            '<span class="' + LABEL + '">Note</span>' +
            '<input id="f-note" type="text" maxlength="200" autocomplete="off" placeholder="Optional: easy 5k pace" class="' + FIELD + '">' +
          '</label>' +
          '<div id="photo-row">' +
            '<input id="f-photo-input" type="file" accept="image/png,image/jpeg,image/gif,image/webp" class="hidden">' +
            '<button id="photo-add-btn" type="button" class="un-pressable w-full h-[100px] rounded-2xl border border-dashed border-[#d4d4db] flex flex-col items-center justify-center gap-1.5 text-[#8e8e93]">' +
              '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h3l1.8-2.4A1 1 0 019.6 4h4.8a1 1 0 01.8.6L17 7h3a1 1 0 011 1v11a1 1 0 01-1 1H4a1 1 0 01-1-1V8a1 1 0 011-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg>' +
              '<span class="text-[15px] font-medium">Add photo</span>' +
            '</button>' +
            '<div id="photo-preview-wrap" class="hidden relative">' +
              '<img id="photo-preview" class="w-full h-[140px] rounded-2xl object-cover" alt="">' +
              '<button id="photo-remove-btn" type="button" aria-label="Remove photo" class="un-touch-target absolute top-2 right-2 w-8 h-8 rounded-full bg-black/55 text-white flex items-center justify-center">' +
                '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
              '</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<button id="post-run-btn" type="button" disabled class="mt-5 w-full h-[58px] rounded-2xl bg-[#0a7aff] text-white text-[19px] font-semibold disabled:opacity-40">Post run</button>';

      return wrap;
    }

    function openSheet() {
      if (state.sheet) return;
      var contentEl = buildSheet();
      var handle = unNative.presentSheet({
        contentEl: contentEl,
        onDismiss: function () {
          // Dismissal animates, so this can land after a different sheet
          // has already claimed the slot. Only clear what is still ours.
          if (state.sheet === handle) {
            state.sheet = null;
            state.sheetKind = null;
          }
          if (location.hash === '#new') setHash('');
        },
      });
      state.sheet = handle;
      state.sheetKind = 'new';

      var where = contentEl.querySelector('#f-where');
      var when = contentEl.querySelector('#f-when');
      var note = contentEl.querySelector('#f-note');
      var distance = contentEl.querySelector('#f-distance');
      var post = contentEl.querySelector('#post-run-btn');

      var photoRow = contentEl.querySelector('#photo-row');
      var photoAddBtn = contentEl.querySelector('#photo-add-btn');
      var photoInput = contentEl.querySelector('#f-photo-input');
      var photoPreviewWrap = contentEl.querySelector('#photo-preview-wrap');
      var photoPreviewImg = contentEl.querySelector('#photo-preview');
      var photoRemoveBtn = contentEl.querySelector('#photo-remove-btn');
      var photo = null; // { url, id } once an upload has succeeded

      // usernode.uploadFile rejects with no platform shell (standalone/dev);
      // hide the control there instead of offering something that always fails.
      if (!(window.usernode && usernode.uploadFile)) {
        photoRow.classList.add('hidden');
      } else {
        photoAddBtn.addEventListener('click', function () { photoInput.click(); });

        photoInput.addEventListener('change', function () {
          var file = photoInput.files && photoInput.files[0];
          photoInput.value = '';
          if (!file) return;
          var label = photoAddBtn.querySelector('span');
          photoAddBtn.disabled = true;
          label.textContent = 'Uploading...';
          downscaleImage(file)
            .then(function (blob) { return usernode.uploadFile(blob, { visibility: 'public' }); })
            .then(function (stored) {
              photo = { url: stored.url, id: stored.id };
              photoPreviewImg.src = stored.url;
              photoPreviewWrap.classList.remove('hidden');
              photoAddBtn.classList.add('hidden');
            })
            .catch(function (err) { notify(photoErrorMessage(err)); })
            .then(function () {
              photoAddBtn.disabled = false;
              label.textContent = 'Add photo';
            });
        });

        photoRemoveBtn.addEventListener('click', function () {
          photo = null;
          photoPreviewWrap.classList.add('hidden');
          photoAddBtn.classList.remove('hidden');
        });
      }

      // Default the picker to the next round hour so a poster only has to
      // confirm rather than fill in four fields.
      var soon = new Date(Date.now() + 60 * 60 * 1000);
      soon.setMinutes(0, 0, 0);
      var pad = function (n) { return String(n).padStart(2, '0'); };
      // datetime-local wants local wall-clock time, never an ISO/UTC string.
      when.value = soon.getFullYear() + '-' + pad(soon.getMonth() + 1) + '-' +
        pad(soon.getDate()) + 'T' + pad(soon.getHours()) + ':' + pad(soon.getMinutes());

      function sync() {
        post.disabled = !(where.value.trim() && when.value);
      }
      [where, when].forEach(function (el) {
        el.addEventListener('input', sync);
        el.addEventListener('change', sync);
      });
      sync();

      contentEl.querySelector('#sheet-close').addEventListener('click', function () {
        handle.dismiss();
      });

      post.addEventListener('click', function () {
        if (post.disabled) return;
        var startsAt = new Date(when.value);
        if (isNaN(startsAt.getTime())) { notify('Pick a date and time.'); return; }
        post.disabled = true;
        post.textContent = 'Posting...';
        api('/api/runs', {
          method: 'POST',
          body: JSON.stringify({
            location: where.value.trim(),
            note: note.value.trim(),
            starts_at: startsAt.toISOString(),
            // Left out entirely when blank, so the column stays null
            // rather than picking up a 0 nobody meant.
            distance_km: distance.value.trim() || undefined,
            photo_url: photo ? photo.url : undefined,
            photo_file_id: photo ? photo.id : undefined,
          }),
        }).then(function () {
          handle.dismiss();
          state.tab = 'upcoming';
          renderTabs();
          // A run with a distance changes this week's progress, and the
          // organizer is an attendee, so the goal card moves too.
          return Promise.all([loadRuns(), loadGoal()]);
        }).then(function () {
          notify('Run posted.');
        }).catch(function (err) {
          post.disabled = false;
          post.textContent = 'Post run';
          notify(err.message);
        });
      });

      where.focus({ preventScroll: true });
    }

    /* ── Weekly goal sheet ─────────────────────────────────────────── */

    var GOAL_PICKS = [10, 20, 30, 50];

    function buildGoalSheet() {
      var current = state.goal && state.goal.goal ? state.goal.goal.target_km : null;
      var wrap = document.createElement('div');
      wrap.className = 'pb-1';

      var picks = GOAL_PICKS.map(function (km) {
        return '<button type="button" data-km="' + km + '" ' +
          'class="goal-pick un-pressable flex-1 h-[46px] rounded-xl bg-[#f1f1f5] text-[17px] font-semibold text-[#111114]">' +
          esc(fmtKm(km)) + '</button>';
      }).join('');

      // A deep link is the only way to reach this sheet without a token, so
      // say why saving is off rather than letting the button fail.
      var note = token
        ? '<p class="mt-3 px-1 text-[15px] leading-snug text-[#8e8e93]">Only runs with a distance count toward this. Your week starts on Monday.</p>'
        : '<p class="mt-3 px-1 text-[15px] leading-snug text-[#8e8e93]">Open Run Club in Usernode to save a goal.</p>';

      var remove = current == null
        ? ''
        : '<button id="remove-goal-btn" type="button" class="un-pressable mt-2 w-full h-[50px] rounded-2xl bg-transparent text-[17px] font-semibold text-[#ff3b30]">Remove goal</button>';

      wrap.innerHTML =
        '<div class="flex items-center justify-between gap-3">' +
          '<h2 class="text-[30px] font-extrabold tracking-tight">Weekly goal</h2>' +
          '<button id="goal-sheet-close" type="button" aria-label="Close" class="un-touch-target shrink-0 w-9 h-9 rounded-full bg-[#e9e9ef] text-[#8e8e93] flex items-center justify-center">' +
            '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
          '</button>' +
        '</div>' +
        '<div class="mt-5 flex items-center gap-3 rounded-2xl border border-[#e4e4ea] px-4 py-4">' +
          '<svg class="shrink-0 text-[#0a7aff]" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5A1.5 1.5 0 014.5 7h15A1.5 1.5 0 0121 8.5v7a1.5 1.5 0 01-1.5 1.5h-15A1.5 1.5 0 013 15.5v-7zM7.5 7v3M12 7v4M16.5 7v3"/></svg>' +
          '<span class="shrink-0 w-[64px] text-[17px] text-[#6b6b73]">Target</span>' +
          '<input id="f-goal" type="number" inputmode="decimal" step="0.1" min="1" max="500" placeholder="20" ' +
            'value="' + (current == null ? '' : esc(current)) + '" ' +
            'class="flex-1 min-w-0 bg-transparent outline-none text-[17px] text-[#111114] placeholder:text-[#b6b6bd] text-right">' +
          '<span class="shrink-0 text-[17px] text-[#8e8e93]">km</span>' +
        '</div>' +
        '<div class="mt-3 flex items-center gap-2">' + picks + '</div>' +
        note +
        '<button id="save-goal-btn" type="button"' + (token ? '' : ' disabled') +
          ' class="mt-4 w-full h-[58px] rounded-2xl bg-[#0a7aff] text-white text-[19px] font-semibold disabled:opacity-40">Save goal</button>' +
        remove;

      return wrap;
    }

    function openGoalSheet() {
      if (state.sheet) return;
      if (!(window.unNative && unNative.presentSheet)) return;
      var contentEl = buildGoalSheet();
      var handle = unNative.presentSheet({
        contentEl: contentEl,
        onDismiss: function () {
          // Dismissal animates, so this can land after a different sheet
          // has already claimed the slot. Only clear what is still ours.
          if (state.sheet === handle) {
            state.sheet = null;
            state.sheetKind = null;
          }
          if (location.hash === '#goal') setHash('');
        },
      });
      state.sheet = handle;
      state.sheetKind = 'goal';

      var field = contentEl.querySelector('#f-goal');
      var save = contentEl.querySelector('#save-goal-btn');
      var removeBtn = contentEl.querySelector('#remove-goal-btn');

      contentEl.querySelector('#goal-sheet-close').addEventListener('click', function () {
        handle.dismiss();
      });

      contentEl.addEventListener('click', function (e) {
        var pick = e.target.closest('.goal-pick');
        if (!pick) return;
        field.value = pick.dataset.km;
      });

      save.addEventListener('click', function () {
        if (save.disabled) return;
        var value = Number(field.value);
        if (!isFinite(value) || value < 1 || value > 500) {
          notify('Pick a goal between 1 and 500 km.');
          return;
        }
        save.disabled = true;
        save.textContent = 'Saving...';
        api('/api/me/goal', {
          method: 'PUT',
          body: JSON.stringify({ target_km: value }),
        }).then(function () {
          handle.dismiss();
          return loadGoal();
        }).then(function () {
          notify('Weekly goal saved.');
        }).catch(function (err) {
          save.disabled = false;
          save.textContent = 'Save goal';
          notify(err.message);
        });
      });

      if (removeBtn) {
        removeBtn.addEventListener('click', function () {
          confirmRemoveGoal().then(function (yes) {
            if (!yes) return;
            return api('/api/me/goal', { method: 'DELETE' }).then(function () {
              handle.dismiss();
              return loadGoal();
            }).then(function () {
              notify('Weekly goal removed.');
            }).catch(function (err) { notify(err.message); });
          });
        });
      }

      field.focus({ preventScroll: true });
    }

    function confirmRemoveGoal() {
      if (!(window.unNative && unNative.alert)) return Promise.resolve(true);
      return unNative.alert({
        title: 'Remove goal?',
        message: 'Your runs stay on the board. Only the goal card goes away.',
        buttons: [
          { label: 'Cancel', style: 'cancel' },
          { label: 'Remove', style: 'destructive' },
        ],
      }).then(function (r) {
        return !!(r && r.button && r.button.style === 'destructive');
      }).catch(function () { return false; });
    }

    goalEl.addEventListener('click', function (e) {
      if (e.target.closest('#set-goal-btn') || e.target.closest('#edit-goal-btn')) {
        setHash('goal');
      }
    });

    /* ── Actions ───────────────────────────────────────────────────── */

    function joinRun(id) {
      return api('/api/runs/' + id + '/join', { method: 'POST' });
    }

    function leaveRun(id) {
      return api('/api/runs/' + id + '/leave', { method: 'POST' });
    }

    function refreshBoth(id) {
      // Joining or leaving changes who is counted against the goal, so it
      // is refreshed alongside the board rather than going stale.
      var jobs = [loadRuns(), loadGoal()];
      if (id != null && state.detail && state.detail.run.id === id) {
        jobs.push(loadDetail(id).then(renderDetail));
      }
      return Promise.all(jobs);
    }

    listEl.addEventListener('click', function (e) {
      var join = e.target.closest('.join-btn');
      if (join) {
        // The card underneath is itself a button; stop the tap here so a
        // join does not also navigate.
        e.stopPropagation();
        if (join.dataset.joined === '1') return;
        join.disabled = true;
        joinRun(parseInt(join.dataset.id, 10))
          .then(function () { return loadRuns(); })
          .catch(function (err) { join.disabled = false; notify(err.message); });
        return;
      }
      var card = e.target.closest('.run-card');
      if (card) setHash('run/' + card.dataset.id);
    });

    listEl.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      var card = e.target.closest('.run-card');
      if (card) { e.preventDefault(); setHash('run/' + card.dataset.id); }
    });

    detailBodyEl.addEventListener('click', function (e) {
      var btn = e.target.closest('#detail-action');
      if (!btn || !state.detail) return;
      var id = state.detail.run.id;
      var leaving = btn.dataset.action === 'leave';
      btn.disabled = true;
      (leaving ? leaveRun(id) : joinRun(id))
        .then(function () { return refreshBoth(id); })
        .then(function () { notify(leaving ? 'You left this run.' : 'You are going.'); })
        .catch(function (err) { btn.disabled = false; notify(err.message); });
    });

    document.getElementById('more-btn').addEventListener('click', function (e) {
      if (!state.detail) return;
      var run = state.detail.run;
      var isPast = new Date(run.starts_at).getTime() < Date.now();
      var items = [];
      if (!isPast && run.is_organizer) {
        items.push({ label: 'Cancel run', destructive: true, value: 'cancel', icon: 'trash' });
      } else if (!isPast && run.joined) {
        items.push({ label: 'Leave run', destructive: true, value: 'leave' });
      }
      // The detail screen shows a time but has no room for the segmented
      // control, so the same choice lives here.
      items.push({
        label: state.timeFormat === '24' ? 'Show am/pm times' : 'Show 24 hour times',
        value: 'timeformat',
      });
      unNative.menu({ anchorEl: e.currentTarget, items: items, cancelLabel: 'Cancel' })
        .then(function (choice) {
          if (!choice) return;
          if (choice.value === 'timeformat') {
            setFormat(state.timeFormat === '24' ? '12' : '24');
            return;
          }
          if (choice.value === 'leave') {
            return leaveRun(run.id)
              .then(function () { return refreshBoth(run.id); })
              .then(function () { notify('You left this run.'); });
          }
          return unNative.alert({
            title: 'Cancel this run?',
            message: 'Everyone who joined will lose it. This cannot be undone.',
            buttons: [
              { label: 'Keep it', style: 'cancel' },
              { label: 'Cancel run', style: 'destructive' },
            ],
          }).then(function (res) {
            if (!res || !res.button || res.button.style !== 'destructive') return;
            // Best-effort: an orphaned upload just sits against the app's
            // quota, which is a smaller problem than a cancel that fails
            // because the storage call did.
            var cleanup = (run.photo_file_id && window.usernode && usernode.deleteFile)
              ? usernode.deleteFile(run.photo_file_id).catch(function () {})
              : Promise.resolve();
            return cleanup
              .then(function () { return api('/api/runs/' + run.id, { method: 'DELETE' }); })
              .then(function () {
                state.detail = null;
                setHash('');
                return loadRuns();
              }).then(function () { notify('Run cancelled.'); });
          });
        })
        .catch(function (err) { notify(err.message); });
    });

    document.getElementById('new-run-btn').addEventListener('click', function () {
      setHash('new');
    });

    document.getElementById('back-btn').addEventListener('click', function () {
      setHash('');
    });

    document.getElementById('time-format').addEventListener('click', function (e) {
      var btn = e.target.closest('button[data-format]');
      if (btn) setFormat(btn.dataset.format);
    });

    [['tab-upcoming', 'upcoming'], ['tab-past', 'past']].forEach(function (pair) {
      document.getElementById(pair[0]).addEventListener('click', function () {
        if (state.tab === pair[1]) return;
        state.tab = pair[1];
        state.runs = [];
        renderTabs();
        renderList();
        loadRuns();
      });
    });

    /* ── Routing: #new and #run/<id> are the deep links ────────────── */

    var suppressHash = false;

    function setHash(value) {
      var next = value ? '#' + value : '';
      if ((location.hash || '') === next) { route(); return; }
      if (next) location.hash = next;
      else if (history.replaceState) {
        history.replaceState(null, '', location.pathname + location.search);
        route();
      } else location.hash = '';
    }

    function route() {
      if (suppressHash) return;
      var h = (location.hash || '').replace(/^#/, '');
      var run = h.match(/^run\/(\d+)$/);

      if (run) {
        if (state.sheet) state.sheet.dismiss();
        var id = parseInt(run[1], 10);
        var already = state.detail && state.detail.run.id === id;
        loadDetail(id).then(function () {
          renderDetail();
          showScreen('detail', already ? 'none' : 'push');
        }).catch(function (err) {
          notify(err.message);
          setHash('');
        });
        return;
      }

      showScreen('home', 'pop');
      // Dismiss first when the other sheet is up: presentSheet only ever
      // holds one, so opening without this would be silently swallowed.
      if (h === 'new' || h === 'goal') {
        var want = h === 'new' ? 'new' : 'goal';
        if (state.sheet && state.sheetKind !== want) {
          var prev = state.sheet;
          state.sheet = null;
          state.sheetKind = null;
          prev.dismiss();
        }
        if (want === 'new') openSheet();
        else openGoalSheet();
      } else if (state.sheet) {
        state.sheet.dismiss();
      }
    }

    window.addEventListener('hashchange', route);

    /* ── Boot ──────────────────────────────────────────────────────── */

    // Precedence: an explicit ?tf= deep link, then the remembered choice,
    // then am/pm so nothing changes for anyone who never touches the
    // toggle. The link is pure view state with no database write, so it is
    // deliberately not staging-gated: the "before" screenshot is taken
    // against production. It is also deliberately NOT persisted, so a link
    // shared for a screenshot cannot quietly re-set the reader's own
    // choice, and so the default stays the default on the next plain load.
    (function resolveFormat() {
      var linked = params.get('tf');
      if (linked === '12' || linked === '24') {
        state.timeFormat = linked;
        return;
      }
      var stored = readFormat();
      if (stored) state.timeFormat = stored;
    })();

    renderTimeFormat();
    renderTabs();
    loadGoal();
    loadRuns().then(route);

    if (window.unNative && unNative.attachPullToRefresh) {
      unNative.attachPullToRefresh(window, function () {
        return state.screen === 'detail' && state.detail
          ? loadDetail(state.detail.run.id).then(renderDetail)
          : Promise.all([loadRuns(), loadGoal()]);
      }, { content: document.getElementById('app') });
    }
  })();
  </script>
</body>
</html>
