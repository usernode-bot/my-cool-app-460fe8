<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  
  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
          if (val instanceof Error) return val.stack || (val.name + ': ' + val.message);
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>Run Club</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%230a7aff'/><text x='50' y='68' font-size='52' text-anchor='middle'>%F0%9F%8F%83</text></svg>">

  <!-- Tailwind, PRECOMPILED for this app. The config lives in
       tailwind.config.js at the repo root; the Dockerfile's builder stage
       compiles it to public/tailwind.css on every image build, so the
       stylesheet is regenerated from THIS commit's markup every deploy and
       can never drift behind the code.
       Writing class names as whole literals is what keeps this working — a
       class assembled from fragments at runtime (e.g. "bg-" + tone + "-500")
       is invisible to the compiler. -->
  <link rel="stylesheet" href="/tailwind.css">

  <!-- usernode-native UI kit, loaded AFTER tailwind.css so its component
       styles win over Tailwind's preflight reset. Centrally hosted: never
       vendor these, so kit fixes reach this app on the next page load. -->
  <link rel="stylesheet" href="https://social-vibecoding.usernodelabs.org/usernode-native/v1/native.css">
  <script src="https://social-vibecoding.usernodelabs.org/usernode-native/v1/native.js"></script>

  <!-- The platform bridge. Required whether or not this app calls a bridge
       API: it is also how the app answers the shell. -->
  <script src="https://social-vibecoding.usernodelabs.org/usernode-bridge/v1/bridge.js"></script>

  <style>
    /* Re-theme the kit to Run Club's blue. Physics and geometry stay the
       kit's; only the color tokens are ours. */
    :root {
      --un-accent: #0a7aff;
      --un-accent-contrast: #ffffff;
      --un-group-bg: #ffffff;
      --un-sheet-bg: #ffffff;
      --un-hairline: #ececf0;
      --un-muted: #8e8e93;
      --un-radius-card: 16px;
    }
    /* Native date/time controls inherit the row's typography instead of
       the browser default, so the When row reads like the other two. */
    input[type="date"], input[type="time"] {
      font: inherit;
      color: inherit;
      background: transparent;
      -webkit-appearance: none;
      appearance: none;
      min-width: 0;
    }
    input[type="date"]::-webkit-calendar-picker-indicator,
    input[type="time"]::-webkit-calendar-picker-indicator { opacity: 0.35; }
    input[type="date"]:invalid, input[type="time"]:invalid { color: #b6b6bd; }
  </style>
</head>
<body class="bg-[#f2f2f7] text-[#111114] antialiased">
  <!-- Safe-area top inset: bare env() is 0px inside the platform frame, so
       the bridge-forwarded custom property comes first with env() as the
       standalone fallback. -->
  <div id="app" class="mx-auto w-full max-w-[560px]"
       style="padding-top: calc(var(--un-safe-inset-top, env(safe-area-inset-top, 0px)) + 14px);
              padding-bottom: calc(var(--un-safe-inset-bottom, env(safe-area-inset-bottom, 0px)));">

    <!-- ── Home ─────────────────────────────────────────────────────── -->
    <section id="screen-home" class="px-5 pb-24">
      <header class="flex items-start justify-between gap-4">
        <h1 class="text-[40px] font-extrabold tracking-tight leading-none pt-1">Run Club</h1>
        <button id="new-run-btn" type="button" aria-label="Post a new run"
          class="un-touch-target shrink-0 w-[52px] h-[52px] rounded-full bg-white shadow-[0_1px_3px_rgba(0,0,0,0.08)] flex items-center justify-center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </button>
      </header>

      <div class="mt-6 grid grid-cols-2 gap-1 p-1 bg-[#e5e5ea] rounded-[14px]">
        <button id="tab-upcoming" type="button" data-tab="upcoming"
          class="rounded-[11px] py-2.5 text-[17px] font-medium bg-white text-[#111114] shadow-[0_1px_3px_rgba(0,0,0,0.08)]">Upcoming</button>
        <button id="tab-past" type="button" data-tab="past"
          class="rounded-[11px] py-2.5 text-[17px] font-medium bg-transparent text-[#8e8e93] shadow-none">Past</button>
      </div>

      <h2 id="list-heading" class="mt-6 mb-3 px-1 text-[13px] font-semibold tracking-[0.07em] text-[#8e8e93]">UPCOMING RUNS</h2>
      <div id="run-list" class="space-y-3"></div>
    </section>

    <!-- ── Run details ──────────────────────────────────────────────── -->
    <section id="screen-detail" class="px-5 pb-24 hidden">
      <header class="flex items-center justify-between">
        <button id="back-btn" type="button" aria-label="Back"
          class="un-touch-target w-[52px] h-[52px] rounded-full bg-white shadow-[0_1px_3px_rgba(0,0,0,0.08)] flex items-center justify-center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 5l-7 7 7 7"/>
          </svg>
        </button>
        <button id="more-btn" type="button" aria-label="More options"
          class="un-touch-target w-[52px] h-[52px] rounded-full bg-white shadow-[0_1px_3px_rgba(0,0,0,0.08)] flex items-center justify-center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/>
          </svg>
        </button>
      </header>
      <h1 class="mt-4 text-[40px] font-extrabold tracking-tight leading-none">Run details</h1>
      <div id="detail-body" class="mt-6 space-y-6"></div>
    </section>

  </div>

  <script>
  (function () {
    'use strict';

    var params = new URLSearchParams(window.location.search);
    var token = params.get('token') || '';
    var authHeaders = token ? { 'x-usernode-token': token } : {};

    var homeEl = document.getElementById('screen-home');
    var detailEl = document.getElementById('screen-detail');
    var listEl = document.getElementById('run-list');
    var headingEl = document.getElementById('list-heading');
    var detailBodyEl = document.getElementById('detail-body');

    var state = {
      tab: 'upcoming',
      runs: [],
      detail: null,      // { run, attendees }
      screen: 'home',
      sheet: null,
      me: null,          // resolved from the first API response we own
    };

    /* ── Small helpers ─────────────────────────────────────────────── */

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function hash(s) {
      var h = 0;
      for (var i = 0; i < String(s).length; i++) h = (h * 31 + String(s).charCodeAt(i)) >>> 0;
      return h;
    }

    function api(url, opts) {
      var o = opts || {};
      var headers = Object.assign({}, authHeaders, o.headers || {});
      if (o.body) headers['Content-Type'] = 'application/json';
      return fetch(url, Object.assign({}, o, { headers: headers })).then(function (res) {
        return res.json().catch(function () { return {}; }).then(function (data) {
          if (!res.ok) throw new Error(data.error || 'Something went wrong.');
          return data;
        });
      });
    }

    function notify(message) {
      if (window.unNative && unNative.toast) unNative.toast(message);
    }

    /* ── Maps: lazy Leaflet, routing and elevation ─────────────────── */

    // Leaflet loads on first use (route preview, or a detail screen with a
    // route), so the home screen payload is unchanged and a CDN outage can
    // never break the app shell. Failures resolve to a "Map unavailable"
    // placeholder instead of throwing.
    var leafletPromise = null;
    function loadLeaflet() {
      if (window.L) return Promise.resolve(window.L);
      if (leafletPromise) return leafletPromise;
      leafletPromise = new Promise(function (resolve, reject) {
        var css = document.createElement('link');
        css.rel = 'stylesheet';
        css.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';
        document.head.appendChild(css);
        var s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
        s.onload = function () {
          if (window.L) { resolve(window.L); return; }
          leafletPromise = null;
          reject(new Error('Map unavailable'));
        };
        s.onerror = function () {
          leafletPromise = null;
          reject(new Error('Map unavailable'));
        };
        document.head.appendChild(s);
      });
      return leafletPromise;
    }

    function osmTiles(L) {
      return L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      });
    }

    var START_PIN = '#0a7aff';
    var FINISH_PIN = '#ef4444';

    function pinIcon(L, color) {
      return L.divIcon({
        className: '',
        html: '<div style="width:22px;height:22px;border-radius:50%;background:' + color +
          ';border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,0.4)"></div>',
        iconSize: [22, 22],
        iconAnchor: [11, 11],
      });
    }

    function mapUnavailable(el) {
      el.innerHTML = '<div class="h-full flex items-center justify-center text-[15px] text-[#8e8e93]">Map unavailable</div>';
    }

    function fmtKm(m) {
      return new Intl.NumberFormat(locale, {
        minimumFractionDigits: 1, maximumFractionDigits: 1,
      }).format(m / 1000) + ' km';
    }

    function fmtGain(m) {
      return new Intl.NumberFormat(locale).format(m) + ' m';
    }

    function haversineM(aLat, aLng, bLat, bLng) {
      var R = 6371000, rad = Math.PI / 180;
      var dLat = (bLat - aLat) * rad, dLng = (bLng - aLng) * rad;
      var s = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(aLat * rad) * Math.cos(bLat * rad) *
        Math.sin(dLng / 2) * Math.sin(dLng / 2);
      return 2 * R * Math.asin(Math.sqrt(s));
    }

    // Thin a GeoJSON coordinate list to at most `max` uniformly kept points,
    // so stored routes stay small.
    function thinCoords(coords, max) {
      if (coords.length <= max) return coords;
      var out = [], step = (coords.length - 1) / (max - 1);
      for (var i = 0; i < max; i++) out.push(coords[Math.round(i * step)]);
      return out;
    }

    // Sample the route roughly every 100-150 m, capped at 100 points (one
    // Open-Meteo request).
    function elevationSamples(coords) {
      var cum = [0], total = 0;
      for (var i = 1; i < coords.length; i++) {
        total += haversineM(coords[i - 1][1], coords[i - 1][0], coords[i][1], coords[i][0]);
        cum.push(total);
      }
      var step = Math.max(100, total / 99);
      var pts = [coords[0]], next = step;
      for (var j = 1; j < coords.length - 1 && pts.length < 99; j++) {
        if (cum[j] >= next) { pts.push(coords[j]); next += step; }
      }
      pts.push(coords[coords.length - 1]);
      return pts;
    }

    // Sum the climbs, ignoring wobbles under 2 m so elevation-grid noise
    // does not inflate the number.
    function climbFromElevations(elev) {
      var gain = 0, ref = elev[0];
      for (var i = 1; i < elev.length; i++) {
        if (elev[i] - ref >= 2) { gain += elev[i] - ref; ref = elev[i]; }
        else if (elev[i] < ref) ref = elev[i];
      }
      return Math.round(gain);
    }

    // On-foot route from the FOSSGIS public OSRM instance (keyless). The
    // caller falls back to straightRoute() when this fails.
    function fetchFootRoute(start, finish) {
      var url = 'https://routing.openstreetmap.de/routed-foot/route/v1/foot/' +
        start.lng + ',' + start.lat + ';' + finish.lng + ',' + finish.lat +
        '?overview=full&geometries=geojson';
      return fetch(url).then(function (res) {
        if (!res.ok) throw new Error('route');
        return res.json();
      }).then(function (data) {
        var r = data && data.routes && data.routes[0];
        if (!r || !r.geometry || !Array.isArray(r.geometry.coordinates) ||
            r.geometry.coordinates.length < 2) throw new Error('route');
        return {
          coords: thinCoords(r.geometry.coordinates, 200),
          distanceM: Math.round(r.distance),
          straight: false,
        };
      });
    }

    function straightRoute(start, finish) {
      return {
        coords: [[start.lng, start.lat], [finish.lng, finish.lat]],
        distanceM: Math.max(1, Math.round(haversineM(start.lat, start.lng, finish.lat, finish.lng))),
        straight: true,
      };
    }

    // Elevation gain along the route from Open-Meteo (keyless, one batched
    // request). Resolves the gain in meters or rejects; the preview shows
    // "Elevation unavailable" on rejection rather than blocking the post.
    function fetchElevationGain(coords) {
      var pts = elevationSamples(coords);
      var lats = pts.map(function (c) { return c[1].toFixed(5); }).join(',');
      var lngs = pts.map(function (c) { return c[0].toFixed(5); }).join(',');
      return fetch('https://api.open-meteo.com/v1/elevation?latitude=' + lats + '&longitude=' + lngs)
        .then(function (res) {
          if (!res.ok) throw new Error('elevation');
          return res.json();
        })
        .then(function (data) {
          if (!data || !Array.isArray(data.elevation) || data.elevation.length < 2) {
            throw new Error('elevation');
          }
          return climbFromElevations(data.elevation.map(Number));
        });
    }

    /* ── Locale-aware dates ────────────────────────────────────────── */

    // A language tag can be malformed: some devices report POSIX-style
    // values like "en-US@posix", and a stored platform preference is just a
    // string. Intl throws a RangeError on those, which would take every
    // date on the screen down with it, so keep only tags Intl accepts and
    // fall back to the runtime default (undefined) otherwise.
    function safeLocale(tag) {
      if (!tag) return undefined;
      try {
        new Intl.DateTimeFormat(tag);
        return tag;
      } catch (err) {
        return undefined;
      }
    }

    var locale = safeLocale(navigator.language);
    if (window.usernode && usernode.getUserLocale) {
      usernode.getUserLocale().then(function (r) {
        // null means "no preference set", not English: keep the device
        // language in that case.
        var next = r && r.locale ? safeLocale(r.locale) : undefined;
        if (next) { locale = next; render(); }
      }).catch(function () {});
    }

    function fmtTime(d) {
      return new Intl.DateTimeFormat(locale, { hour: 'numeric', minute: '2-digit' }).format(d);
    }

    // Today / Tomorrow / Yesterday where they apply, a short date otherwise.
    function dayInfo(d) {
      var today = new Date(); today.setHours(0, 0, 0, 0);
      var that = new Date(d); that.setHours(0, 0, 0, 0);
      var days = Math.round((that.getTime() - today.getTime()) / 86400000);
      if (days === 0) return { label: 'Today', tone: 'today' };
      if (days === 1) return { label: 'Tomorrow', tone: 'tomorrow' };
      if (days === -1) return { label: 'Yesterday', tone: 'plain' };
      return {
        label: new Intl.DateTimeFormat(locale, {
          weekday: 'short', month: 'short', day: 'numeric',
        }).format(d),
        tone: 'plain',
      };
    }

    function badgeHtml(info) {
      if (info.tone === 'today') {
        return '<span class="px-2 py-0.5 rounded-md bg-[#d7f5de] text-[#1b8a3d] text-[16px] font-semibold">' + esc(info.label) + '</span>';
      }
      if (info.tone === 'tomorrow') {
        return '<span class="px-2 py-0.5 rounded-md bg-[#dbeafe] text-[#0a7aff] text-[16px] font-semibold">' + esc(info.label) + '</span>';
      }
      return '<span class="text-[16px] font-semibold text-[#111114]">' + esc(info.label) + '</span>';
    }

    /* ── Location glyphs and avatars ───────────────────────────────── */

    // Whole-literal class strings: Tailwind's extractor is a regex over
    // this file, so an assembled "bg-[" + hex + "]" would never compile.
    var GLYPHS = [
      { bg: 'bg-[#dcf5e3]', fg: 'text-[#23a455]', d: 'M12 3l4 6h-2.5l3 5H14l3 5H7l3-5H7.5l3-5H8l4-6zM12 19v2' },
      { bg: 'bg-[#dbeafe]', fg: 'text-[#2b7fff]', d: 'M3 8c2-2 4-2 6 0s4 2 6 0 4-2 6 0M3 13c2-2 4-2 6 0s4 2 6 0 4-2 6 0M3 18c2-2 4-2 6 0s4 2 6 0 4-2 6 0' },
      { bg: 'bg-[#ede4ff]', fg: 'text-[#8b5cf6]', d: 'M12 21s7-5.5 7-11a7 7 0 10-14 0c0 5.5 7 11 7 11zM12 12a2.5 2.5 0 100-5 2.5 2.5 0 000 5z' },
      { bg: 'bg-[#ffe8d5]', fg: 'text-[#f97316]', d: 'M12 5c5 0 9 3.1 9 7s-4 7-9 7-9-3.1-9-7 4-7 9-7zm0 4c2.2 0 4 1.3 4 3s-1.8 3-4 3-4-1.3-4-3 1.8-3 4-3z' },
      { bg: 'bg-[#ffe1ee]', fg: 'text-[#ec4899]', d: 'M3 19l6-10 4 6 2.5-4L21 19H3z' },
    ];

    function glyphHtml(location, size) {
      var g = GLYPHS[hash(location) % GLYPHS.length];
      var box = size === 'lg' ? 'w-[52px] h-[52px]' : 'w-[52px] h-[52px]';
      return '<div class="' + box + ' shrink-0 rounded-[14px] ' + g.bg + ' ' + g.fg +
        ' flex items-center justify-center">' +
        '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
        'stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="' + g.d + '"/></svg></div>';
    }

    // The platform exposes usernames, not profile photos, so an initial on
    // a stable color stands in for one.
    var AVATAR_TONES = [
      'bg-[#f97316]', 'bg-[#0a7aff]', 'bg-[#22c55e]',
      'bg-[#a855f7]', 'bg-[#ec4899]', 'bg-[#14b8a6]',
    ];

    function avatarHtml(username, size, ring) {
      var tone = AVATAR_TONES[hash(username) % AVATAR_TONES.length];
      var dims = size === 'lg'
        ? 'w-11 h-11 text-[18px]'
        : (size === 'md' ? 'w-9 h-9 text-[15px]' : 'w-8 h-8 text-[13px]');
      var initial = String(username || '?').trim().charAt(0).toUpperCase() || '?';
      return '<span title="' + esc(username) + '" class="' + dims + ' ' + tone +
        ' shrink-0 rounded-full text-white font-semibold flex items-center justify-center' +
        (ring ? ' ring-2 ring-white' : '') + '">' + esc(initial) + '</span>';
    }

    function clusterHtml(names) {
      if (!names || !names.length) return '';
      return '<div class="flex items-center -space-x-2">' +
        names.map(function (n) { return avatarHtml(n, 'sm', true); }).join('') + '</div>';
    }

    /* ── Home list ─────────────────────────────────────────────────── */

    function cardHtml(run) {
      var past = state.tab === 'past';
      var when = new Date(run.starts_at);
      var info = dayInfo(when);
      var count = run.attendee_count || 0;
      var note = run.note
        ? '<p class="mt-1 text-[17px] text-[#8e8e93] truncate">' + esc(run.note) + '</p>'
        : '';
      var dist = run.distance_m
        ? '<span class="text-[17px] text-[#8e8e93]">· ' + esc(fmtKm(run.distance_m)) + '</span>'
        : '';

      var action = '';
      if (!past) {
        action = run.joined
          ? '<button type="button" class="join-btn shrink-0 px-5 py-2.5 rounded-full bg-[#e9e9ef] text-[#8e8e93] text-[17px] font-semibold" data-id="' + run.id + '" data-joined="1">Joined</button>'
          : '<button type="button" class="join-btn shrink-0 px-6 py-2.5 rounded-full bg-[#0a7aff] text-white text-[17px] font-semibold" data-id="' + run.id + '" data-joined="0">Join</button>';
      }

      return '<div class="run-card un-pressable bg-white rounded-2xl p-4 shadow-[0_1px_3px_rgba(0,0,0,0.05)]" role="button" tabindex="0" data-id="' + run.id + '">' +
        '<div class="flex gap-3">' + glyphHtml(run.location) +
          '<div class="min-w-0 flex-1">' +
            '<h3 class="text-[19px] font-bold leading-tight truncate">' + esc(run.location) + '</h3>' +
            '<div class="mt-1.5 flex items-center gap-2">' + badgeHtml(info) +
              '<span class="text-[17px] text-[#8e8e93]">' + esc(fmtTime(when)) + '</span>' + dist + '</div>' +
            note +
          '</div>' +
        '</div>' +
        '<div class="mt-3.5 flex items-center justify-between gap-3">' +
          '<div class="flex items-center min-w-0">' + clusterHtml(run.preview) +
            '<span class="ml-2 text-[17px] text-[#8e8e93] truncate">' + count + ' ' + (past ? 'went' : 'going') + '</span>' +
          '</div>' + action +
        '</div>' +
      '</div>';
    }

    function renderList() {
      headingEl.textContent = state.tab === 'past' ? 'PAST RUNS' : 'UPCOMING RUNS';
      if (!state.runs.length) {
        listEl.innerHTML = '<p class="py-12 text-center text-[17px] text-[#8e8e93]">' +
          (state.tab === 'past'
            ? 'No past runs yet.'
            : 'No upcoming runs. Tap + to post one.') + '</p>';
        return;
      }
      listEl.innerHTML = state.runs.map(cardHtml).join('');
    }

    var TAB_ON = 'rounded-[11px] py-2.5 text-[17px] font-medium bg-white text-[#111114] shadow-[0_1px_3px_rgba(0,0,0,0.08)]';
    var TAB_OFF = 'rounded-[11px] py-2.5 text-[17px] font-medium bg-transparent text-[#8e8e93] shadow-none';

    function renderTabs() {
      document.getElementById('tab-upcoming').className =
        state.tab === 'upcoming' ? TAB_ON : TAB_OFF;
      document.getElementById('tab-past').className =
        state.tab === 'past' ? TAB_ON : TAB_OFF;
    }

    function loadRuns() {
      return api('/api/runs?filter=' + state.tab).then(function (data) {
        state.runs = data.runs || [];
        renderList();
      }).catch(function (err) {
        notify(err.message);
      });
    }

    /* ── Run details ───────────────────────────────────────────────── */

    function detailHtml(run, attendees) {
      var when = new Date(run.starts_at);
      var info = dayInfo(when);
      var whenText = info.label + ' · ' + fmtTime(when);
      var isPast = when.getTime() < Date.now();
      var count = run.attendee_count || 0;

      var action = '';
      if (!isPast && !run.is_organizer) {
        action = run.joined
          ? '<button id="detail-action" type="button" data-action="leave" class="shrink-0 px-6 py-2.5 rounded-full bg-[#e9e9ef] text-[#6b6b73] text-[17px] font-semibold">Leave</button>'
          : '<button id="detail-action" type="button" data-action="join" class="shrink-0 px-7 py-2.5 rounded-full bg-[#0a7aff] text-white text-[17px] font-semibold">Join</button>';
      }

      var note = run.note
        ? '<p class="mt-1 text-[17px] text-[#8e8e93]">' + esc(run.note) + '</p>'
        : '';

      var summary =
        '<div class="bg-white rounded-2xl p-4">' +
          '<div class="flex gap-3">' + glyphHtml(run.location, 'lg') +
            '<div class="min-w-0 flex-1">' +
              '<h2 class="text-[19px] font-bold leading-tight">' + esc(run.location) + '</h2>' +
              '<p class="mt-1 text-[17px] font-semibold text-[#0a7aff]">' + esc(whenText) + '</p>' +
              note +
            '</div>' +
          '</div>' +
          '<div class="mt-4 pt-4 border-t border-[#ececf0] flex items-center justify-between gap-3">' +
            '<div class="flex items-center gap-3 min-w-0">' + avatarHtml(run.organizer_username, 'lg') +
              '<span class="min-w-0 text-[17px] leading-snug text-[#8e8e93] break-words">Organized by ' + esc(run.organizer_username) + '</span>' +
            '</div>' + action +
          '</div>' +
        '</div>';

      // `wrap` lets a long value run onto a second line instead of being cut
      // off; the short ones stay on a single right-aligned line.
      function infoRow(iconPath, label, value, blue, wrap) {
        return '<div class="flex items-center gap-3 px-4 py-4">' +
          '<svg class="shrink-0 text-[#0a7aff]" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="' + iconPath + '"/></svg>' +
          '<span class="shrink-0 text-[19px] font-medium">' + esc(label) + '</span>' +
          '<span class="ml-auto min-w-0 text-[19px] text-right ' + (wrap ? '' : 'truncate ') + (blue ? 'text-[#0a7aff] font-medium' : 'text-[#8e8e93]') + '">' + esc(value) + '</span>' +
        '</div>';
      }

      var PIN = 'M12 21s7-5.5 7-11a7 7 0 10-14 0c0 5.5 7 11 7 11zM12 12a2.5 2.5 0 100-5 2.5 2.5 0 000 5z';
      var CAL = 'M4 6.5A1.5 1.5 0 015.5 5h13A1.5 1.5 0 0120 6.5v12a1.5 1.5 0 01-1.5 1.5h-13A1.5 1.5 0 014 18.5v-12zM4 10h16M8 3v4M16 3v4';
      var PEOPLE = 'M9 11a3.5 3.5 0 100-7 3.5 3.5 0 000 7zM3 20a6 6 0 0112 0M17.5 11.5a3 3 0 100-6M18 20a5.5 5.5 0 00-2-4.3';
      var FLAG = 'M6 21V4M6 5h11l-2.5 4 2.5 4H6';
      var ROUTE = 'M5 18.5a2.75 2.75 0 110-5.5h14a2.75 2.75 0 100-5.5H10';
      var MOUNTAIN = 'M3 19l6-10 4 6 2.5-4L21 19H3z';

      var hasRoute = run.start_lat != null && run.start_lng != null &&
        run.end_lat != null && run.end_lng != null;
      var mapCard = hasRoute
        ? '<div class="bg-white rounded-2xl p-2">' +
            '<div id="detail-map" class="h-[220px] rounded-xl overflow-hidden bg-[#e5e5ea]"></div>' +
          '</div>'
        : '';

      var facts = '<div class="bg-white rounded-2xl divide-y divide-[#ececf0]">' +
        infoRow(PIN, 'Where', run.location, false, true) +
        (run.end_location ? infoRow(FLAG, 'Finish', run.end_location, false, true) : '') +
        infoRow(CAL, 'When', whenText, true) +
        (run.distance_m ? infoRow(ROUTE, 'Distance', fmtKm(run.distance_m), false) : '') +
        (run.elevation_gain_m != null ? infoRow(MOUNTAIN, 'Elevation gain', fmtGain(run.elevation_gain_m), false) : '') +
        infoRow(PEOPLE, 'Going', count + (count === 1 ? ' runner' : ' runners'), false) +
      '</div>';

      var rows = (attendees || []).map(function (a) {
        var badge = a.is_organizer
          ? '<span class="px-2 py-0.5 rounded-md bg-[#dbeafe] text-[#0a7aff] text-[14px] font-semibold">Organizer</span>'
          : '';
        return '<div class="flex items-center gap-3 px-4 py-3.5">' +
          avatarHtml(a.username, 'lg') +
          '<span class="min-w-0 flex-1 text-[19px] font-medium truncate">' + esc(a.username) + '</span>' +
          badge +
        '</div>';
      }).join('');

      var going = '<div>' +
        '<h3 class="mb-2 px-1 text-[13px] font-semibold tracking-[0.07em] text-[#8e8e93]">WHO\'S GOING</h3>' +
        (rows
          ? '<div class="bg-white rounded-2xl divide-y divide-[#ececf0]">' + rows + '</div>'
          : '<div class="bg-white rounded-2xl px-4 py-8 text-center text-[17px] text-[#8e8e93]">Nobody has joined yet.</div>') +
      '</div>';

      var footnote = '<p class="flex items-start gap-2 px-1 pb-2 text-[15px] leading-snug text-[#8e8e93]">' +
        '<svg class="mt-0.5 shrink-0 text-[#0a7aff]" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.6v.1"/></svg>' +
        (isPast
          ? 'This run has already happened.'
          : run.is_organizer
            ? 'You are organizing this run. Cancel it from the menu if plans change.'
            : 'Join to be counted as going. You can leave anytime.') + '</p>';

      return summary + mapCard + facts + going + footnote;
    }

    // The detail map is a Leaflet instance living inside innerHTML we
    // replace on every render, so it is torn down first and re-created
    // against the fresh #detail-map node. The generation counter keeps a
    // slow Leaflet load from painting into a newer render.
    var detailMap = null;
    var detailMapGen = 0;

    function destroyDetailMap() {
      detailMapGen++;
      if (detailMap) {
        try { detailMap.remove(); } catch (e) {}
        detailMap = null;
      }
    }

    function renderDetailMap(run) {
      var gen = detailMapGen;
      loadLeaflet().then(function (L) {
        var host = document.getElementById('detail-map');
        if (gen !== detailMapGen || !host) return;
        detailMap = L.map(host, { zoomControl: false });
        osmTiles(L).addTo(detailMap);
        var geo = run.route_geojson;
        var coords = geo && geo.type === 'LineString' &&
          Array.isArray(geo.coordinates) && geo.coordinates.length >= 2
          ? geo.coordinates
          : [[run.start_lng, run.start_lat], [run.end_lng, run.end_lat]];
        var latlngs = coords.map(function (c) { return [c[1], c[0]]; });
        var line = L.polyline(latlngs, { color: '#0a7aff', weight: 4 }).addTo(detailMap);
        L.marker([run.start_lat, run.start_lng], { icon: pinIcon(L, START_PIN) }).addTo(detailMap);
        L.marker([run.end_lat, run.end_lng], { icon: pinIcon(L, FINISH_PIN) }).addTo(detailMap);
        detailMap.fitBounds(line.getBounds(), { padding: [24, 24] });
      }).catch(function () {
        var host = document.getElementById('detail-map');
        if (gen === detailMapGen && host) mapUnavailable(host);
      });
    }

    function renderDetail() {
      if (!state.detail) return;
      destroyDetailMap();
      detailBodyEl.innerHTML = detailHtml(state.detail.run, state.detail.attendees);
      if (document.getElementById('detail-map')) renderDetailMap(state.detail.run);
    }

    function loadDetail(id) {
      return api('/api/runs/' + id).then(function (data) {
        state.detail = { run: data.run, attendees: data.attendees || [] };
        return state.detail;
      });
    }

    function render() {
      renderTabs();
      renderList();
      renderDetail();
    }

    /* ── Screen switching ──────────────────────────────────────────── */

    function showScreen(name, type) {
      if (state.screen === name) return;
      state.screen = name;
      var apply = function () {
        homeEl.classList.toggle('hidden', name !== 'home');
        detailEl.classList.toggle('hidden', name !== 'detail');
        window.scrollTo(0, 0);
      };
      if (window.unNative && unNative.transition) unNative.transition(apply, { type: type || 'none' });
      else apply();
    }

    /* ── New Run sheet: step 1 form, step 2 route preview ──────────── */

    function newDraft() {
      // Default the picker to the next round hour so a poster only has to
      // confirm rather than fill in four fields.
      var soon = new Date(Date.now() + 60 * 60 * 1000);
      soon.setMinutes(0, 0, 0);
      var pad = function (n) { return String(n).padStart(2, '0'); };
      // datetime-local wants local wall-clock time, never an ISO/UTC string.
      var when = soon.getFullYear() + '-' + pad(soon.getMonth() + 1) + '-' +
        pad(soon.getDate()) + 'T' + pad(soon.getHours()) + ':' + pad(soon.getMinutes());
      return {
        where: '', finish: '', when: when, note: '',
        start: null, end: null,   // pins: { lat, lng }
        route: null,              // { coords, distanceM, straight }
        gainM: null, gainFailed: false,
      };
    }

    function openSheet() {
      if (state.sheet) return;
      var draft = newDraft();
      var contentEl = document.createElement('div');
      contentEl.className = 'pb-1';
      var preview = null; // step-2 map controller, torn down on step change

      var handle = unNative.presentSheet({
        contentEl: contentEl,
        onDismiss: function () {
          if (preview) { preview.destroy(); preview = null; }
          state.sheet = null;
          if (location.hash === '#new') setHash('');
        },
      });
      state.sheet = handle;

      function postRun(withRoute) {
        var body = {
          location: draft.where,
          note: draft.note,
          starts_at: new Date(draft.when).toISOString(),
          end_location: draft.finish,
        };
        if (withRoute && draft.start && draft.end) {
          // If the route fetch is still in flight, fall back to the
          // straight line rather than silently dropping the pins.
          var route = draft.route || straightRoute(draft.start, draft.end);
          body.start_lat = draft.start.lat;
          body.start_lng = draft.start.lng;
          body.end_lat = draft.end.lat;
          body.end_lng = draft.end.lng;
          body.distance_m = route.distanceM;
          body.elevation_gain_m = draft.gainM;
          body.route_geojson = { type: 'LineString', coordinates: route.coords };
        }
        return api('/api/runs', { method: 'POST', body: JSON.stringify(body) })
          .then(function () {
            handle.dismiss();
            state.tab = 'upcoming';
            renderTabs();
            return loadRuns();
          }).then(function () {
            notify('Run posted.');
          });
      }

      function submit(btn, withRoute) {
        if (btn.disabled) return;
        btn.disabled = true;
        var was = btn.textContent;
        btn.textContent = 'Posting...';
        postRun(withRoute).catch(function (err) {
          btn.disabled = false;
          btn.textContent = was;
          notify(err.message);
        });
      }

      function showStep1() {
        if (preview) { preview.destroy(); preview = null; }
        var ROW = 'flex items-center gap-3 rounded-2xl border border-[#e4e4ea] px-4 py-4';
        var LABEL = 'shrink-0 w-[64px] text-[17px] text-[#6b6b73]';
        var FIELD = 'flex-1 min-w-0 bg-transparent outline-none text-[17px] text-[#111114] placeholder:text-[#b6b6bd]';

        contentEl.innerHTML =
          '<div class="flex items-center justify-between gap-3">' +
            '<h2 class="text-[30px] font-extrabold tracking-tight">New Run</h2>' +
            '<button id="sheet-close" type="button" aria-label="Close" class="un-touch-target shrink-0 w-9 h-9 rounded-full bg-[#e9e9ef] text-[#8e8e93] flex items-center justify-center">' +
              '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
            '</button>' +
          '</div>' +
          '<div class="mt-5 space-y-3">' +
            '<label class="' + ROW + '">' +
              '<svg class="shrink-0 text-[#23a455]" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.5 7-11a7 7 0 10-14 0c0 5.5 7 11 7 11zM12 12a2.5 2.5 0 100-5 2.5 2.5 0 000 5z"/></svg>' +
              '<span class="' + LABEL + '">Where</span>' +
              '<input id="f-where" type="text" maxlength="120" autocomplete="off" placeholder="e.g. Riverside Park" class="' + FIELD + '">' +
            '</label>' +
            '<label class="' + ROW + '">' +
              '<svg class="shrink-0 text-[#ef4444]" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V4M6 5h11l-2.5 4 2.5 4H6"/></svg>' +
              '<span class="' + LABEL + '">Finish</span>' +
              '<input id="f-finish" type="text" maxlength="120" autocomplete="off" placeholder="Optional: where it ends" class="' + FIELD + '">' +
            '</label>' +
            '<div class="' + ROW + '">' +
              '<svg class="shrink-0 text-[#0a7aff]" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5A1.5 1.5 0 015.5 5h13A1.5 1.5 0 0120 6.5v12a1.5 1.5 0 01-1.5 1.5h-13A1.5 1.5 0 014 18.5v-12zM4 10h16M8 3v4M16 3v4"/></svg>' +
              '<span class="' + LABEL + '">When</span>' +
              '<input id="f-when" type="datetime-local" required aria-label="Date and time" class="' + FIELD + ' text-right">' +
            '</div>' +
            '<label class="' + ROW + '">' +
              '<svg class="shrink-0 text-[#8b5cf6]" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8l-5-5zM14 3v5h5"/></svg>' +
              '<span class="' + LABEL + '">Note</span>' +
              '<input id="f-note" type="text" maxlength="200" autocomplete="off" placeholder="Optional: easy 5k pace" class="' + FIELD + '">' +
            '</label>' +
          '</div>' +
          '<button id="post-run-btn" type="button" disabled class="mt-5 w-full h-[58px] rounded-2xl bg-[#0a7aff] text-white text-[19px] font-semibold disabled:opacity-40">Preview route</button>';

        var where = contentEl.querySelector('#f-where');
        var finish = contentEl.querySelector('#f-finish');
        var when = contentEl.querySelector('#f-when');
        var note = contentEl.querySelector('#f-note');
        var next = contentEl.querySelector('#post-run-btn');

        where.value = draft.where;
        finish.value = draft.finish;
        when.value = draft.when;
        note.value = draft.note;

        function sync() {
          next.disabled = !(where.value.trim() && when.value);
        }
        [where, when].forEach(function (el) {
          el.addEventListener('input', sync);
          el.addEventListener('change', sync);
        });
        sync();

        contentEl.querySelector('#sheet-close').addEventListener('click', function () {
          handle.dismiss();
        });

        next.addEventListener('click', function () {
          if (next.disabled) return;
          var startsAt = new Date(when.value);
          if (isNaN(startsAt.getTime())) { notify('Pick a date and time.'); return; }
          draft.where = where.value.trim();
          draft.finish = finish.value.trim();
          draft.when = when.value;
          draft.note = note.value.trim();
          showStep2();
        });

        where.focus({ preventScroll: true });
      }

      function showStep2() {
        contentEl.innerHTML =
          '<div class="flex items-center justify-between gap-3">' +
            '<h2 class="text-[30px] font-extrabold tracking-tight">Route preview</h2>' +
            '<button id="rp-close" type="button" aria-label="Close" class="un-touch-target shrink-0 w-9 h-9 rounded-full bg-[#e9e9ef] text-[#8e8e93] flex items-center justify-center">' +
              '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
            '</button>' +
          '</div>' +
          '<p id="rp-hint" class="mt-2 text-[15px] text-[#8e8e93]">Tap the map to set your start point.</p>' +
          '<div id="rp-map" class="mt-3 h-[300px] rounded-2xl overflow-hidden bg-[#e5e5ea]"></div>' +
          '<div class="mt-3 flex items-center justify-between gap-3 min-h-[24px]">' +
            '<div id="rp-stats" class="min-w-0 flex-1 text-[17px] text-[#8e8e93]"></div>' +
            '<button id="rp-reset" type="button" class="shrink-0 text-[17px] font-medium text-[#0a7aff]">Reset pins</button>' +
          '</div>' +
          '<button id="rp-post" type="button" class="mt-4 w-full h-[58px] rounded-2xl bg-[#0a7aff] text-white text-[19px] font-semibold">Post run</button>' +
          '<div class="mt-3 grid grid-cols-2 gap-3">' +
            '<button id="rp-back" type="button" class="h-[48px] rounded-2xl bg-[#e9e9ef] text-[#111114] text-[17px] font-semibold">Back</button>' +
            '<button id="rp-skip" type="button" class="h-[48px] rounded-2xl bg-[#e9e9ef] text-[#6b6b73] text-[17px] font-semibold">Skip route</button>' +
          '</div>';

        var mapDiv = contentEl.querySelector('#rp-map');
        var hintEl = contentEl.querySelector('#rp-hint');
        var statsEl = contentEl.querySelector('#rp-stats');
        var postBtn = contentEl.querySelector('#rp-post');

        // The sheet drags to dismiss and the map pans; let Leaflet own any
        // touch that begins inside the map.
        ['touchstart', 'touchmove', 'pointerdown'].forEach(function (ev) {
          mapDiv.addEventListener(ev, function (e) { e.stopPropagation(); });
        });

        preview = createRoutePreview(mapDiv, hintEl, statsEl);

        contentEl.querySelector('#rp-close').addEventListener('click', function () {
          handle.dismiss();
        });
        contentEl.querySelector('#rp-reset').addEventListener('click', function () {
          if (preview) preview.reset();
        });
        contentEl.querySelector('#rp-back').addEventListener('click', showStep1);
        contentEl.querySelector('#rp-skip').addEventListener('click', function () {
          submit(contentEl.querySelector('#rp-skip'), false);
        });
        postBtn.addEventListener('click', function () {
          submit(postBtn, true);
        });
      }

      // Owns the step-2 Leaflet map: tap-to-place draggable pins, the route
      // fetch (with straight-line fallback), the elevation fetch, and the
      // hint/stat lines. Everything it learns lands on `draft`.
      function createRoutePreview(mapDiv, hintEl, statsEl) {
        var map = null, startMarker = null, endMarker = null, line = null;
        var gen = 0, debounceT = null, destroyed = false;

        function hint() {
          if (!draft.start) hintEl.textContent = 'Tap the map to set your start point.';
          else if (!draft.end) hintEl.textContent = 'Tap again to set your finish point.';
          else hintEl.textContent = 'Drag a pin to adjust the route.';
        }

        function stats() {
          if (!draft.start || !draft.end) {
            statsEl.textContent = draft.start ? 'Place a finish pin to see the route.' : '';
            return;
          }
          if (!draft.route) { statsEl.textContent = 'Calculating route...'; return; }
          var html = '<span class="font-semibold text-[#111114]">' + esc(fmtKm(draft.route.distanceM)) + '</span>';
          if (draft.gainM != null) {
            html += ' · <span class="font-semibold text-[#111114]">' + esc(fmtGain(draft.gainM)) + '</span> gain';
          } else if (draft.gainFailed) {
            html += ' · Elevation unavailable';
          }
          if (draft.route.straight) {
            html += '<span class="block text-[13px]">Straight-line estimate</span>';
          }
          statsEl.innerHTML = html;
        }

        function drawLine(coords) {
          if (!map) return;
          if (line) { map.removeLayer(line); line = null; }
          if (!coords) return;
          var latlngs = coords.map(function (c) { return [c[1], c[0]]; });
          line = window.L.polyline(latlngs, { color: '#0a7aff', weight: 4 }).addTo(map);
          map.fitBounds(line.getBounds(), { padding: [28, 28] });
        }

        function recompute() {
          gen++;
          draft.route = null;
          draft.gainM = null;
          draft.gainFailed = false;
          stats();
          if (!draft.start || !draft.end) { drawLine(null); return; }
          if (debounceT) clearTimeout(debounceT);
          debounceT = setTimeout(function () {
            var g = ++gen;
            fetchFootRoute(draft.start, draft.end)
              .catch(function () { return straightRoute(draft.start, draft.end); })
              .then(function (route) {
                if (destroyed || g !== gen) return;
                draft.route = route;
                drawLine(route.coords);
                stats();
                fetchElevationGain(route.coords).then(function (gainM) {
                  if (destroyed || g !== gen) return;
                  draft.gainM = gainM;
                  stats();
                }).catch(function () {
                  if (destroyed || g !== gen) return;
                  draft.gainFailed = true;
                  stats();
                });
              });
          }, 400);
        }

        function addStart(latlng) {
          draft.start = { lat: latlng.lat, lng: latlng.lng };
          startMarker = window.L.marker(latlng, { icon: pinIcon(window.L, START_PIN), draggable: true }).addTo(map);
          startMarker.on('dragend', function () {
            var p = startMarker.getLatLng();
            draft.start = { lat: p.lat, lng: p.lng };
            recompute();
          });
        }

        function addEnd(latlng) {
          draft.end = { lat: latlng.lat, lng: latlng.lng };
          endMarker = window.L.marker(latlng, { icon: pinIcon(window.L, FINISH_PIN), draggable: true }).addTo(map);
          endMarker.on('dragend', function () {
            var p = endMarker.getLatLng();
            draft.end = { lat: p.lat, lng: p.lng };
            recompute();
          });
        }

        function reset() {
          gen++;
          draft.start = null;
          draft.end = null;
          draft.route = null;
          draft.gainM = null;
          draft.gainFailed = false;
          if (map) {
            if (startMarker) { map.removeLayer(startMarker); startMarker = null; }
            if (endMarker) { map.removeLayer(endMarker); endMarker = null; }
            drawLine(null);
          }
          hint();
          stats();
        }

        function initialView() {
          var fallback = function () {
            var seen = state.runs.filter(function (r) { return r.start_lat != null; })[0];
            if (seen) map.setView([seen.start_lat, seen.start_lng], 13);
            else map.setView([20, 0], 2);
          };
          fallback();
          if (navigator.geolocation) {
            // Only used to center the map; never stored or sent anywhere.
            navigator.geolocation.getCurrentPosition(function (pos) {
              if (!destroyed && map && !draft.start) {
                map.setView([pos.coords.latitude, pos.coords.longitude], 14);
              }
            }, function () {}, { timeout: 3000, maximumAge: 600000 });
          }
        }

        loadLeaflet().then(function (L) {
          if (destroyed) return;
          map = L.map(mapDiv, { zoomControl: false });
          osmTiles(L).addTo(map);
          // Coming back from step 1 restores whatever was already placed.
          if (draft.start) addStart(draft.start);
          if (draft.end) addEnd(draft.end);
          if (draft.start && draft.end) recompute();
          else initialView();
          map.on('click', function (e) {
            if (!draft.start) addStart(e.latlng);
            else if (!draft.end) addEnd(e.latlng);
            else return;
            hint();
            recompute();
          });
          hint();
          stats();
        }).catch(function () {
          if (destroyed) return;
          mapUnavailable(mapDiv);
          hintEl.textContent = 'The map could not load. You can still post the run.';
        });

        function destroy() {
          destroyed = true;
          gen++;
          if (debounceT) clearTimeout(debounceT);
          if (map) {
            try { map.remove(); } catch (e) {}
            map = null;
          }
        }

        hint();
        stats();
        return { reset: reset, destroy: destroy };
      }

      showStep1();
    }

    /* ── Actions ───────────────────────────────────────────────────── */

    function joinRun(id) {
      return api('/api/runs/' + id + '/join', { method: 'POST' });
    }

    function leaveRun(id) {
      return api('/api/runs/' + id + '/leave', { method: 'POST' });
    }

    function refreshBoth(id) {
      var jobs = [loadRuns()];
      if (id != null && state.detail && state.detail.run.id === id) {
        jobs.push(loadDetail(id).then(renderDetail));
      }
      return Promise.all(jobs);
    }

    listEl.addEventListener('click', function (e) {
      var join = e.target.closest('.join-btn');
      if (join) {
        // The card underneath is itself a button; stop the tap here so a
        // join does not also navigate.
        e.stopPropagation();
        if (join.dataset.joined === '1') return;
        join.disabled = true;
        joinRun(parseInt(join.dataset.id, 10))
          .then(function () { return loadRuns(); })
          .catch(function (err) { join.disabled = false; notify(err.message); });
        return;
      }
      var card = e.target.closest('.run-card');
      if (card) setHash('run/' + card.dataset.id);
    });

    listEl.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      var card = e.target.closest('.run-card');
      if (card) { e.preventDefault(); setHash('run/' + card.dataset.id); }
    });

    detailBodyEl.addEventListener('click', function (e) {
      var btn = e.target.closest('#detail-action');
      if (!btn || !state.detail) return;
      var id = state.detail.run.id;
      var leaving = btn.dataset.action === 'leave';
      btn.disabled = true;
      (leaving ? leaveRun(id) : joinRun(id))
        .then(function () { return refreshBoth(id); })
        .then(function () { notify(leaving ? 'You left this run.' : 'You are going.'); })
        .catch(function (err) { btn.disabled = false; notify(err.message); });
    });

    document.getElementById('more-btn').addEventListener('click', function (e) {
      if (!state.detail) return;
      var run = state.detail.run;
      var isPast = new Date(run.starts_at).getTime() < Date.now();
      var items = [];
      if (!isPast && run.is_organizer) {
        items.push({ label: 'Cancel run', destructive: true, value: 'cancel', icon: 'trash' });
      } else if (!isPast && run.joined) {
        items.push({ label: 'Leave run', destructive: true, value: 'leave' });
      }
      if (!items.length) {
        notify(isPast ? 'This run has already happened.' : 'Nothing to do here yet.');
        return;
      }
      unNative.menu({ anchorEl: e.currentTarget, items: items, cancelLabel: 'Cancel' })
        .then(function (choice) {
          if (!choice) return;
          if (choice.value === 'leave') {
            return leaveRun(run.id)
              .then(function () { return refreshBoth(run.id); })
              .then(function () { notify('You left this run.'); });
          }
          return unNative.alert({
            title: 'Cancel this run?',
            message: 'Everyone who joined will lose it. This cannot be undone.',
            buttons: [
              { label: 'Keep it', style: 'cancel' },
              { label: 'Cancel run', style: 'destructive' },
            ],
          }).then(function (res) {
            if (!res || !res.button || res.button.style !== 'destructive') return;
            return api('/api/runs/' + run.id, { method: 'DELETE' }).then(function () {
              state.detail = null;
              setHash('');
              return loadRuns();
            }).then(function () { notify('Run cancelled.'); });
          });
        })
        .catch(function (err) { notify(err.message); });
    });

    document.getElementById('new-run-btn').addEventListener('click', function () {
      setHash('new');
    });

    document.getElementById('back-btn').addEventListener('click', function () {
      setHash('');
    });

    [['tab-upcoming', 'upcoming'], ['tab-past', 'past']].forEach(function (pair) {
      document.getElementById(pair[0]).addEventListener('click', function () {
        if (state.tab === pair[1]) return;
        state.tab = pair[1];
        state.runs = [];
        renderTabs();
        renderList();
        loadRuns();
      });
    });

    /* ── Routing: #new and #run/<id> are the deep links ────────────── */

    var suppressHash = false;

    function setHash(value) {
      var next = value ? '#' + value : '';
      if ((location.hash || '') === next) { route(); return; }
      if (next) location.hash = next;
      else if (history.replaceState) {
        history.replaceState(null, '', location.pathname + location.search);
        route();
      } else location.hash = '';
    }

    function route() {
      if (suppressHash) return;
      var h = (location.hash || '').replace(/^#/, '');
      var run = h.match(/^run\/(\d+)$/);

      if (run) {
        if (state.sheet) state.sheet.dismiss();
        var id = parseInt(run[1], 10);
        var already = state.detail && state.detail.run.id === id;
        loadDetail(id).then(function () {
          renderDetail();
          showScreen('detail', already ? 'none' : 'push');
        }).catch(function (err) {
          notify(err.message);
          setHash('');
        });
        return;
      }

      showScreen('home', 'pop');
      if (h === 'new') {
        openSheet();
      } else if (state.sheet) {
        state.sheet.dismiss();
      }
    }

    window.addEventListener('hashchange', route);

    /* ── Boot ──────────────────────────────────────────────────────── */

    renderTabs();
    loadRuns().then(route);

    if (window.unNative && unNative.attachPullToRefresh) {
      unNative.attachPullToRefresh(window, function () {
        return state.screen === 'detail' && state.detail
          ? loadDetail(state.detail.run.id).then(renderDetail)
          : loadRuns();
      }, { content: document.getElementById('app') });
    }
  })();
  </script>
</body>
</html>
